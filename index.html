<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Datenlabor Klasse 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE everyday learning for 12-year-olds: friendly, clear, calm working surface
   IDEA a metro map through the lab: each step is a station, Teil 1 blue line, Teil 2 red line
   PICTURE the live widget of each station (bit lamps, safe, unit staircase, storage bar) drawn large
   COLOUR white ground, metro blue and red per part, amber lined paper for Hefter tasks, green for Basis/correct
   TYPE Figtree 800 for titles, Figtree 400/600 for text
   LAYOUT laptop: metro line left, station content right, pager bottom; phone: content only, metro as drawer */
:root{color-scheme:light dark;--fs:17px;--bg:light-dark(#ffffff,#0e1116);--ink:light-dark(#151821,#eef1f6);--soft:light-dark(#596072,#a7aebd);--line:light-dark(#dde2ea,#2b313d);--panel:light-dark(#f3f5f9,#161a22);--blue:light-dark(#0a5cff,#5b8cff);--red:light-dark(#e6261f,#ff5d55);--amber:#ffb400;--paper:light-dark(#fff7dc,#2a2414);--pline:light-dark(#f0dca0,#4a3f22);--green:light-dark(#00975a,#2ecc85);--gsoft:light-dark(#e3f6ec,#123224);--bad:light-dark(#c0261c,#ff7a70);--bsoft:light-dark(#fde8e6,#3a1714);--part:var(--blue);--pro:light-dark(#1f2638,#3d4866);--violet:light-dark(#6a3fd0,#8a66f0)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html{font-size:var(--fs);scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.55 Figtree,system-ui,sans-serif;overflow-x:clip}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
h1,h2,h3{line-height:1.1;letter-spacing:-.02em;margin:0;text-wrap:balance}
h1{font-size:clamp(1.9rem,4vw,2.6rem);font-weight:800}
h2{font-size:1.35rem;font-weight:800;margin-top:1.6rem}
h3{font-size:1.08rem;font-weight:800}
p{margin:.5rem 0;max-width:68ch}
sub{font-size:.7em}
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;padding:8px max(16px,3vw)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{width:38px;height:38px;flex:none}
.brand b{font-size:1.15rem;font-weight:800;display:block;line-height:1.1}
.brand span{font-size:.8rem;color:var(--soft)}
.tbtn{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-weight:600}
.tbtn:hover{border-color:var(--soft)}
#stepsBtn{display:none}
.lk2{display:none}
.prog{display:flex;gap:3px;padding:0 max(16px,3vw) 8px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.prog i{background:color-mix(in srgb,var(--c) 28%,var(--line))}
.prog i.ok{background:var(--c)}
.prog i.cur{outline:2px solid var(--ink);outline-offset:1px}
.wrap{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1240px;margin:0 auto}
.metro{position:sticky;top:80px;align-self:start;padding:22px 10px 22px max(16px,2vw);max-height:calc(100vh - 80px);overflow:auto}
.mpart{font-size:.82rem;font-weight:800;margin:6px 0 6px 2px;color:var(--soft)}
.mpart.t1{color:var(--blue)}.mpart.t2{color:var(--red);margin-top:14px}
.st{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;border:0;background:none;text-align:left;padding:4px 6px;border-radius:10px;position:relative}
.st:hover{background:var(--panel)}
.st .dot{width:22px;height:22px;border-radius:50%;border:4px solid var(--c);background:var(--bg);flex:none;position:relative;z-index:1;display:grid;place-items:center}
.st::before{content:"";position:absolute;left:15px;top:-6px;bottom:-6px;width:6px;background:var(--c)}
.st.first::before{top:50%}.st.last::before{bottom:50%}
.st.ok .dot{background:var(--c)}
.st.ok .dot svg{width:12px;height:12px;color:#fff}
.st .dot svg{width:11px;height:11px;color:var(--c)}
.st.cur .dot{transform:scale(1.25);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 25%,transparent)}
.st.cur{font-weight:800;background:var(--panel)}
.st small{display:block;color:var(--soft);font-size:.8rem;font-weight:400}
main{padding:22px max(16px,3vw) 120px;max-width:900px}
.kicker{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:.85rem;font-weight:600;background:var(--panel);border:1px solid var(--line);white-space:nowrap}
.tag.part{background:var(--part);color:#fff;border-color:transparent}
.bitty{display:flex;gap:12px;align-items:flex-start;margin:16px 0}
.bitty svg{width:56px;height:56px;flex:none}
.bitty p{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:10px 14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.lead{font-size:1.1rem}
.ic{width:20px;height:20px;flex:none;vertical-align:-4px}
/* Hefter */
.hef{margin:18px 0;border-radius:6px 14px 14px 6px;background:var(--paper);background-image:repeating-linear-gradient(transparent 0 calc(1.55em - 1px),var(--pline) calc(1.55em - 1px) 1.55em);border:2px solid var(--amber);padding:14px 16px 12px 46px;position:relative}
.hef::before{content:"";position:absolute;left:14px;top:12px;bottom:12px;width:14px;background:radial-gradient(circle at 7px 7px,var(--bg) 4px,transparent 5px) 0 0/14px 26px repeat-y}
.hef .hh{display:flex;align-items:center;gap:8px;font-weight:800;color:light-dark(#7a5200,#ffcf5a);margin-bottom:4px}
.hef .task{font-weight:600;margin:0 0 8px}
.hef .copy{background:var(--bg);border:1px dashed var(--pline);border-radius:8px;padding:10px 14px}
.hef .copy h3{margin-bottom:4px;text-decoration:underline;text-underline-offset:3px}
.hef ol,.hef ul{margin:.3rem 0;padding-left:1.3rem}
.chk{display:flex;align-items:center;gap:10px;margin-top:10px;min-height:44px;font-weight:600;cursor:pointer}
.chk input{width:24px;height:24px;accent-color:var(--green)}
.hef.done{border-color:var(--green)}
/* levels */
.lvl{display:flex;align-items:center;gap:10px;margin:26px 0 8px}
.lvl .badge{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#fff;flex:none}
.lvl .badge svg{width:20px;height:20px}
.lvl small{display:block;color:var(--soft);font-weight:400;font-size:.88rem}
.count{margin-left:auto;font-weight:800;white-space:nowrap;color:var(--green)}
.profi{margin:26px 0;border:2px solid var(--ink);border-radius:14px;overflow:hidden}
.pz-toggle{width:100%;display:flex;align-items:center;gap:12px;padding:12px 16px;border:0;background:var(--ink);color:var(--bg);text-align:left;min-height:56px}
.pz-toggle svg{width:24px;height:24px;flex:none;color:var(--amber)}
.pz-toggle b{font-size:1.05rem}
.pz-toggle small{display:block;opacity:.8}
.pz-toggle .arr{margin-left:auto;font-size:1.3rem;transition:transform .2s}
.pz-toggle[aria-expanded=true] .arr{transform:rotate(180deg)}
.pz-toggle.ready{animation:pulse 1.6s ease-in-out 3}
@keyframes pulse{50%{box-shadow:inset 0 0 0 4px var(--amber)}}
.pz-body{padding:4px 16px 16px}
/* exercises */
.ex{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;background:var(--bg)}
.ex .q{font-weight:600}
.ex .q .n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--panel);border:1px solid var(--line);font-size:.85rem;margin-right:6px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.row input{width:11em;min-height:44px;padding:6px 10px;border:2px solid var(--line);border-radius:10px;background:var(--bg);font-size:1.05rem;font-variant-numeric:tabular-nums}
.row input:focus{border-color:var(--part)}
.unit{font-weight:600;white-space:nowrap}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:0;background:var(--part);color:#fff;font-weight:700}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:38px;padding:0 12px;font-size:.9rem}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.opt{min-height:44px;padding:6px 14px;border-radius:10px;border:2px solid var(--line);background:var(--bg);font-weight:600;text-align:left}
.opt:hover{border-color:var(--part)}
.opt.right{border-color:var(--green);background:var(--gsoft)}
.opt.wrong{border-color:var(--bad);background:var(--bsoft)}
.fb{margin-top:8px;border-radius:8px}
.fb:empty{display:none}
.fb.good{background:var(--gsoft);padding:8px 12px}
.fb.bad{background:var(--bsoft);padding:8px 12px}
.fb.info{background:var(--panel);padding:8px 12px;border:1px solid var(--line)}
.help{display:flex;gap:8px;margin-top:6px}
.help:empty{display:none}
.ex.ok{border-color:var(--green);background:color-mix(in srgb,var(--gsoft) 45%,var(--bg))}
.ex.ok input{border-color:var(--green)}
.okmark{color:var(--green);font-weight:800}
/* tables */
.scroll{overflow-x:auto}
table.pv{border-collapse:collapse;margin:10px 0;font-variant-numeric:tabular-nums}
table.pv td,table.pv th{border:2px solid var(--line);padding:6px 12px;text-align:center;min-width:46px}
table.pv th{background:var(--panel);font-size:.9rem}
table.pv td.one{background:color-mix(in srgb,var(--part) 18%,var(--bg));font-weight:800}
.plan{border-collapse:collapse;width:100%}
.plan td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.plan td:first-child{white-space:nowrap;font-weight:800;width:5.5em}
/* lamps */
.lab{background:light-dark(#10182b,#0a0e18);color:#eef1f6;border-radius:16px;padding:18px;margin:14px 0}
.lamps{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.bit{width:64px;border:0;background:none;color:inherit;display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px}
.bulb{width:52px;height:52px;border-radius:50%;background:#2a3348;border:3px solid #3b4762;display:grid;place-items:center;font-size:1.5rem;font-weight:800;transition:background .15s,box-shadow .15s}
.bit.on .bulb{background:#ffd23f;border-color:#fff1b8;color:#2a1d00;box-shadow:0 0 22px #ffd23f88}
.bit .pv{font-size:.9rem;font-weight:700;color:#9fb0d0}
.readout{display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:center;align-items:baseline;margin-top:14px;font-variant-numeric:tabular-nums}
.readout b{font-size:clamp(1.6rem,5vw,2.3rem);font-weight:800}
.readout span{color:#9fb0d0}
.chal{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px;align-items:center}
.chip{padding:6px 12px;border-radius:99px;border:2px solid #3b4762;font-weight:700;white-space:nowrap}
.chip.now{border-color:#ffd23f;color:#ffd23f}
.chip.got{background:#1f7a4d;border-color:#1f7a4d}
.lab .msg{text-align:center;margin-top:8px;min-height:1.6em;color:#c9f5dd;font-weight:600}
.lab .btn.ghost{background:#222b40;color:#eef1f6;border-color:#3b4762}
.charbox{display:grid;place-items:center;width:70px;height:70px;border-radius:12px;background:#fff;color:#10182b;font-size:2.4rem;font-weight:800}
/* stepper */
.steps{list-style:none;padding:0;margin:10px 0}
.steps li{padding:8px 12px;border-left:4px solid var(--part);background:var(--bg);margin:6px 0;border-radius:0 8px 8px 0;font-variant-numeric:tabular-nums}
.steps li b.y{color:var(--green)}.steps li b.n{color:var(--bad)}
/* vault */
.vault{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:18px;align-items:center}
.vault svg{width:100%;height:auto}
.door{transition:transform .9s ease,opacity .9s;transform-origin:26px 100px;transform-box:view-box}
.open .door{transform:scaleX(.06);opacity:.35}
/* stairs */
.stairs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;align-items:end;margin:40px 0 6px}
.stair{border:0;border-radius:8px 8px 0 0;background:color-mix(in srgb,var(--red) 16%,var(--bg));border:2px solid color-mix(in srgb,var(--red) 40%,var(--bg));display:flex;flex-direction:column;justify-content:flex-start;align-items:center;padding:8px 2px;position:relative;font-weight:800;font-size:clamp(.85rem,2.4vw,1.1rem)}
.stair .fac{position:absolute;top:-30px;left:-14px;font-size:.78rem;background:var(--ink);color:var(--bg);border-radius:99px;padding:2px 7px;white-space:nowrap;z-index:1}
.stair.path{background:color-mix(in srgb,var(--red) 40%,var(--bg))}
.stair.from,.stair.to{background:var(--red);color:#fff;border-color:var(--red)}
.slegend{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:600;font-size:.92rem}
.conv{display:grid;grid-template-columns:repeat(auto-fit,minmax(9em,1fr));gap:10px;margin-top:12px}
.conv label{font-size:.88rem;font-weight:600;color:var(--soft);display:flex;flex-direction:column;gap:4px}
.conv input,.conv select{min-height:44px;padding:6px 10px;border:2px solid var(--line);border-radius:10px;background:var(--bg);font-size:1rem}
.result{font-size:clamp(1.5rem,5vw,2.2rem);font-weight:800;margin-top:12px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.chain{color:var(--soft);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.switch{display:flex;align-items:center;gap:8px;font-weight:600;min-height:44px}
.switch input{width:22px;height:22px;accent-color:var(--ink)}
/* mission */
.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(12em,1fr));gap:10px;margin:12px 0}
.item{display:flex;gap:12px;align-items:center;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);text-align:left}
.item svg{width:38px;height:38px;flex:none;color:var(--red)}
.item b{display:block}
.item small{color:var(--soft)}
button.item[aria-pressed=true]{border-color:var(--red);background:color-mix(in srgb,var(--red) 10%,var(--bg))}
.media{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}
.medium{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border:2px solid var(--line);border-radius:12px;background:var(--bg);text-align:center}
.medium svg{width:46px;height:46px;color:var(--ink)}
.medium small{color:var(--soft);white-space:nowrap}
button.medium[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.meter{height:34px;border-radius:10px;background:var(--bg);border:2px solid var(--ink);overflow:hidden;position:relative;margin-top:10px}
.meter i{display:block;height:100%;background:var(--green);transition:width .3s}
.meter.full i{background:var(--bad)}
.mstat{font-weight:800;margin-top:8px;font-size:1.1rem}
/* final */
.selfrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.seg{display:flex;gap:4px}
.seg button{min-height:40px;padding:0 10px;border:2px solid var(--line);border-radius:8px;background:var(--bg);font-size:.88rem;font-weight:600}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hlist{list-style:none;padding:0}
.hlist li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.hlist .st2{width:26px;height:26px;border-radius:50%;border:2px solid var(--amber);display:grid;place-items:center;flex:none}
.hlist .st2.y{background:var(--green);border-color:var(--green);color:#fff}
.hlist .st2 svg{width:14px;height:14px}
.hlist button{margin-left:auto}
.big{font-size:clamp(2rem,6vw,3rem);font-weight:800;line-height:1}

.opt.pick[aria-pressed=true]{border-color:var(--part);background:color-mix(in srgb,var(--part) 14%,var(--bg));box-shadow:inset 0 0 0 2px var(--part);animation:pop .25s ease}
.opt.pick[aria-pressed=true]::before{content:"✓ ";font-weight:800;color:var(--part)}
@keyframes pop{50%{transform:scale(1.07)}}
.seg button[aria-pressed=true]{animation:pop .2s ease}
.lockcard{display:flex;gap:12px;align-items:flex-start;color:var(--soft)}
.lockcard .ic{width:26px;height:26px;color:var(--ink);flex:none}
.ex.no{border-color:var(--bad)}
.resrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.resrow small{display:block;color:var(--soft)}
.resrow .rnote{color:var(--ink);font-style:italic}
.rdot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800}
.rdot svg{width:16px;height:16px}
.resrow.good .rdot{background:var(--green)}.resrow.bad .rdot{background:var(--bad)}
.unlock{display:flex;gap:14px;align-items:flex-start;background:var(--pro);color:#fff;border:0}
.unlock>svg{width:34px;height:34px;color:var(--amber);flex:none}
.unlock .btn.ghost{background:transparent;color:#fff;border-color:#ffffff66}
.btn.pro{background:var(--amber);color:#151821}
.story .note{background:var(--paper);border-radius:10px;padding:10px 14px;font-style:italic}
.stage{border:2px solid var(--line);border-radius:14px;padding:4px 16px 12px;margin:18px 0}
.stage.sdone{border-color:var(--green)}
.stage.locked{opacity:.75}
.stagehead{display:flex;gap:12px;align-items:center}
.stagehead h2{margin-top:12px}
.stagehead small{color:var(--soft);font-weight:600}
.snum{width:38px;height:38px;border-radius:50%;background:var(--pro);color:var(--amber);display:grid;place-items:center;font-weight:800;flex:none;margin-top:10px}
.stage.sdone .snum{background:var(--green);color:#fff}
@media(max-width:600px){.resrow{grid-template-columns:auto minmax(0,1fr)}.resrow>:last-child{grid-column:2}.unlock{flex-direction:column}}

.beamer .dlg{max-width:980px}
.beamer .bit{width:110px}.beamer .bulb{width:90px;height:90px;font-size:2.6rem}.beamer .bit .pv{font-size:1.4rem}
.plq{font-size:clamp(1.4rem,3.5vw,2.2rem);font-weight:700;margin:12px 0;min-height:1.4em}
.goals li{font-size:1.15rem;margin:4px 0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(12em,1fr));gap:10px;margin:14px 0}
.pjump{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--pro);color:#fff;text-decoration:none;min-height:56px}
.pjump svg{width:24px;height:24px;color:var(--amber);flex:none}
.pjump small{display:block;opacity:.8}
table.abc td,table.abc th{min-width:30px;padding:4px 6px;font-size:.88rem}

.rules{display:flex;flex-wrap:wrap;gap:10px}
.rules span{padding:10px 16px;border-radius:10px;background:var(--bg);border:2px solid var(--line);font-size:1.2rem;font-variant-numeric:tabular-nums}
.rules span small{font-size:.85rem;color:var(--soft)}
.rules span.later{border-style:dashed;color:var(--soft)}
.addt{border-collapse:collapse;margin:0 auto;font-variant-numeric:tabular-nums}
.addt td{width:56px;height:52px;text-align:center;font-size:1.6rem;font-weight:800}
.addt td.lbl{width:auto;text-align:right;padding-right:14px;font-size:.9rem;color:#9fb0d0;font-weight:600;white-space:nowrap}
.addt tr.head td{font-size:.85rem;color:#9fb0d0;height:28px;font-weight:700}
.addt tr.car td{font-size:1.05rem;color:#ffd23f;height:26px}
.addt tr.car td.lbl{font-size:.9rem;color:#ffd23f}
.addt tr.res td{border-top:3px solid #eef1f6}
.addt tr.res td.lbl{border-top:0}
.addt td.q{color:#5b6683}
.addt td.x{color:#9fb0d0}
.addt.ovmode td.x{border:2px dashed #ff7a70;border-width:0 2px;background:#ff5d5512}
.addt.ovmode tr.head td.x{border-top-width:2px;font-size:.72rem;color:#ff9d96}
.addt.ovmode tr.res td.x{border-bottom-width:2px;border-top:3px solid #eef1f6}
.addt td.ovc{color:#ff7a70}
.ab{width:46px;height:46px;border-radius:10px;border:2px solid #3b4762;background:#2a3348;color:#eef1f6;font:inherit;font-size:1.4rem;font-weight:800;cursor:pointer}

<script>
{
const $=s=>document.querySelector(s);
const ico=(n,c='ic')=>`<svg class="${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const fmt=x=>Number(x).toLocaleString('de-DE',{maximumFractionDigits:4});
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const KEY='datenlabor7-v4';
const fresh=()=>({step:0,done:{},tries:{},hef:{},seen:{},fs:17,vault:null,guess:null,self:{},cc:{}});
let S=fresh();
try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r)S=Object.assign(S,r)}catch(e){}
if(window.claude?.hot?.data&&window.claude.hot.data.step!==undefined)S=Object.assign(S,window.claude.hot.data);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
try{window.claude?.hot?.snapshot?.(()=>S)}catch(e){}
document.documentElement.style.setProperty('--fs',S.fs+'px');

/* ---------- helpers ---------- */
const parseDE=s=>{s=String(s).trim().replace(/\s/g,'');if(!s)return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');return Number(s)};
const bin=n=>n.toString(2);
const p4=n=>bin(n).padStart(4,'0');
const norm=s=>String(s).trim().toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/\s+/g,'');
function b2dText(b){const L=b.length;const t=[];for(let i=0;i<L;i++)if(b[i]==='1')t.push(2**(L-1-i));return `${b}<sub>2</sub>: ${t.join(' + ')} = ${parseInt(b,2)}`}
function d2bText(n){let p=1;while(p*2<=n)p*=2;let r=n,parts=[];for(;p>=1;p/=2){if(p<=r){parts.push(`${p} passt (Rest ${r-p})`);r-=p}else parts.push(`${p} passt nicht → 0`)}return `${n}: ${parts.join(', ')} → <b>${bin(n)}<sub>2</sub></b>`}
const say=t=>`<div class="bitty"><svg aria-hidden="true"><use href="#i-bitty"/></svg><p>${t}</p></div>`;

/* ---------- exercises ---------- */
const EX={};
function E(kind,id,q,ans,x={}){EX[id]=Object.assign({kind,id,q,ans},x);return id}
function exHTML(id,n){const d=EX[id];let body;
 if(d.kind==='choice')body=`<div class="opts">${d.opts.map((o,i)=>`<button type="button" class="opt" data-choice="${id}" data-i="${i}">${o}</button>`).join('')}</div>`;
 else body=`<div class="row"><input id="in-${id}" data-in="${id}" autocomplete="off" spellcheck="false" inputmode="${d.kind==='text'?'text':'decimal'}" aria-label="Antwort">${d.unit?`<span class="unit">${d.unit}</span>`:''}<button type="button" class="btn" data-check="${id}">Prüfen</button></div>`;
 return `<div class="ex" id="ex-${id}"><div class="q">${n?`<span class="n">${n}</span>`:''}${d.q}</div>${body}<div class="fb" aria-live="polite"></div><div class="help"></div></div>`}
const exList=ids=>ids.map((id,i)=>exHTML(id,i+1)).join('');
function correctText(d){if(d.kind==='bin')return bin(d.ans);if(d.kind==='choice')return d.opts[d.ans];if(d.kind==='text')return d.ans[0].toUpperCase();return fmt(d.ans)}
function judge(d,v){
 if(d.kind==='choice')return {ok:+v===d.ans};
 if(d.kind==='bin'){const s=String(v).replace(/\s/g,'');if(!s)return {ok:false,msg:'Gib zuerst eine Antwort ein.',empty:1};if(!/^[01]+$/.test(s))return {ok:false,msg:'Eine Binärzahl besteht nur aus 0 und 1.',empty:1};return {ok:parseInt(s,2)===d.ans}}
 if(d.kind==='text'){if(!String(v).trim())return {ok:false,msg:'Gib zuerst eine Antwort ein.',empty:1};return {ok:d.ans.map(norm).includes(norm(v))}}
 if(String(v).trim()==='')return {ok:false,msg:'Gib zuerst eine Antwort ein.',empty:1};const x=parseDE(v);if(isNaN(x))return {ok:false,msg:'Das ist keine Zahl. Schreibe nur Ziffern (Komma ist erlaubt).',empty:1};
 return {ok:Math.abs(x-d.ans)<=(d.tol||1e-9)}}
function check(id,v,btn){const d=EX[id];const el=$('#ex-'+id);if(!el||S.done[id])return;
 const r=judge(d,v);const fb=el.querySelector('.fb');
 if(r.empty){fb.className='fb info';fb.textContent=r.msg;return}
 if(r.ok){S.done[id]=1;save();if(btn)btn.classList.add('right');solved(id,true);update();return}
 S.tries[id]=(S.tries[id]||0)+1;save();if(btn)btn.classList.add('wrong');
 fb.className='fb bad';fb.innerHTML=['Noch nicht richtig. Versuch es noch einmal!','Leider falsch. Schau dir den Tipp an.','Noch nicht. Du kannst dir die Lösung zeigen lassen.'][Math.min(S.tries[id]-1,2)];
 helpBtns(id)}
function helpBtns(id){const d=EX[id],t=S.tries[id]||0,el=$('#ex-'+id);if(!el)return;const h=el.querySelector('.help');let s='';
 if(t>=1&&d.hint)s+=`<button type="button" class="btn ghost sm" data-hint="${id}">Tipp</button>`;
 if(t>=2)s+=`<button type="button" class="btn ghost sm" data-sol="${id}">Lösung zeigen</button>`;h.innerHTML=s}
function solved(id,isNew){const d=EX[id],el=$('#ex-'+id);if(!el)return;el.classList.add('ok');
 const inp=el.querySelector('input');if(inp){if(!inp.value)inp.value=correctText(d);inp.readOnly=true;const b=el.querySelector('[data-check]');if(b)b.remove()}
 if(d.kind==='choice')el.querySelectorAll('.opt').forEach(b=>{if(+b.dataset.i===d.ans)b.classList.add('right');b.disabled=true});
 const fb=el.querySelector('.fb');fb.className='fb good';fb.innerHTML=`<span class="okmark">${isNew?['Richtig!','Super!','Stark!','Genau!'][rnd(0,3)]:'Erledigt.'}</span> ${d.sol||''}`;el.querySelector('.help').innerHTML=''}

/* ---------- Hefter ---------- */
const HEF={h1:{step:1,title:'Stellenwerte im Binärsystem'},h2:{step:2,title:'Vorgehen: Binär → Dezimal'},h3:{step:3,title:'Vorgehen: Dezimal → Binär'},h4:{step:12,title:'Bit und Byte'},h5:{step:13,title:'Die Einheitentreppe'},h6:{step:14,title:'Speicherbedarf berechnen'},h7:{step:6,title:'Binäre Addition'},h8:{step:7,title:'Addition mit Übertrag'},h9:{step:8,title:'Der Überlauf'}};
function hef(id,task,copy){return `<div class="hef${S.hef[id]?' done':''}" id="hef-${id}"><div class="hh">${ico('book')} Hefter-Auftrag</div><p class="task">${task}</p><div class="copy"><h3>${HEF[id].title}</h3>${copy}</div><label class="chk"><input type="checkbox" data-hef="${id}"${S.hef[id]?' checked':''}> Erledigt: Das steht jetzt in meinem Hefter.</label></div>`}
function lvlHead(step){const ids=STEPS[step].b;const n=ids.filter(i=>S.done[i]).length;return `<div class="lvl"><span class="badge">${ico('base','')}</span><div><h3>Basis-Aufgaben</h3><small>Hier übst du das Wichtigste. Löse alle Aufgaben, bevor du weitergehst.</small></div><span class="count" id="cnt-${step}">${n} / ${ids.length}</span></div>`}

if(!S.vault){S.vault={a:rnd(5,15),b:rnd(3,15),c:rnd(17,31)};save()}
const V=S.vault;

/* ---------- steps ---------- */
const STEPS=[];
function step(o){o.b=o.b||[];o.h=o.h||[];STEPS.push(o)}

// 0 Start
step({kind:'s1',lesson:1,title:'Start',sub:'Ablauf und Symbole',min:2,render:()=>`
<h1>Willkommen im Datenlabor</h1>
${say('Hallo, ich bin <b>Bitty</b>! Ich bin ein Computer und verstehe nur zwei Zeichen: <b>0</b> und <b>1</b>. In drei Stunden lernst du meine Sprache, rechnest wie ein Computer und hilfst mir bei einer echten Speicher-Mission.')}
<div class="card"><h3>So ist das Labor aufgebaut</h3><div class="scroll"><table class="plan">
<tr><td>Stunde 1</td><td><b>Binärzahlen</b>: Wie ist eine Binärzahl aufgebaut? Wie rechne ich um? Am Ende knackst du im Check Bittys Tresor.</td></tr>
<tr><td>Stunde 2</td><td><b>Rechnen mit Binärzahlen</b>: Du addierst wie ein Computer, mit und ohne Übertrag, und lernst, was ein Überlauf ist.</td></tr>
<tr><td>Stunde 3</td><td><b>Bit, Byte und Einheiten</b>: Die Klassenfahrt-Mission. Du berechnest, wie viel Speicher die Erinnerungen brauchen und wo sie hinpassen.</td></tr></table></div>
<p style="margin-bottom:0">Jede Stunde endet mit einem <b>Check</b>: Du schätzt dich ein, löst Aufgaben und erfährst, was du noch üben solltest. Danach öffnet sich eine <b>Profi-Zone</b>.</p></div>
<h2>Diese Zeichen begleiten dich</h2>
<div class="card" style="display:grid;gap:12px">
<div style="display:flex;gap:12px;align-items:center"><span class="lvl" style="margin:0"><span class="badge">${ico('base','')}</span></span><div><b>Basis-Aufgaben</b>: Hier übst du das Wichtigste. Erst wenn sie gelöst sind, ist eine Station fertig.</div></div>
<div style="display:flex;gap:12px;align-items:center"><span style="width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--paper);border:2px solid var(--amber);flex:none">${ico('book')}</span><div><b>Hefter-Auftrag</b>: Diesen Kasten schreibst du in deinen Hefter. Danach setzt du den Haken.</div></div>
<div style="display:flex;gap:12px;align-items:center"><span style="width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--pro);color:var(--amber);flex:none">${ico('star','ic')}</span><div><b>Profi-Zone</b>: Schwierige Aufgaben und Rätsel. Sie öffnet sich nach dem Check.</div></div>
</div>
<p>Wenn du bei einer Aufgabe festhängst, erscheint nach einem Fehlversuch ein <b>Tipp</b>, nach zwei Fehlversuchen kannst du dir die <b>Lösung</b> zeigen lassen.</p>
<p class="lead">Lege deinen Hefter bereit und klicke unten auf <b>Weiter</b>.</p>`});

// 1 Binärzahl
step({kind:'s1',lesson:1,title:'Was ist eine Binärzahl?',sub:'Aufbau und Stellenwerte',min:6,
 b:[E('choice','b2a','Welche Ziffern gibt es im Binärsystem?',1,{opts:['0 bis 9','0 und 1','1 und 2','nur die 1'],hint:'„Bi“ bedeutet zwei.',sol:'Nur 0 und 1. Deshalb heißt es auch Zweiersystem.'}),
    E('choice','b2b','Wie heißt eine einzelne Binärziffer?',1,{opts:['Byte','Bit','Bot','Stelle'],hint:'Das Wort ist sehr kurz und hat drei Buchstaben.',sol:'Eine Binärziffer heißt <b>Bit</b> (von binary digit).'}),
    E('choice','b2c','Im Dezimalsystem wird der Stellenwert nach links immer verzehnfacht. Im Binärsystem …',0,{opts:['verdoppelt er sich','verzehnfacht er sich auch','bleibt er gleich','halbiert er sich'],hint:'Schau auf die Zahlen über den Lampen: 1, 2, 4, 8.',sol:'Er verdoppelt sich, weil die Basis 2 ist.'}),
    E('choice','b2d','Was bedeutet eine <b>1</b> an einer Stelle einer Binärzahl?',0,{opts:['Der Stellenwert wird mitgezählt.','Die Stelle ist leer.','Man rechnet an dieser Stelle mal 10.'],hint:'Denk an die Lampen: Was passiert, wenn eine Lampe an ist?',sol:'1 heißt: Der Stellenwert wird verwendet. 0 heißt: Er wird nicht verwendet.'})],
 h:['h1'],
 render:()=>`
<h1>Was ist eine Binärzahl?</h1>
${say('Ihr Menschen zählt mit zehn Ziffern, 0 bis 9. Ich habe nur Strom an (1) und Strom aus (0). Trotzdem kann ich jede Zahl darstellen. Wie? Mit Stellenwerten!')}
<div class="card"><h3>Erinnerung: Dezimalsystem (Basis 10)</h3>
<p>Bei der Zahl 6314 hat jede Ziffer einen Stellenwert. Nach links wird er immer <b>zehnmal</b> so groß.</p>
<div class="scroll"><table class="pv"><tr><th>1000</th><th>100</th><th>10</th><th>1</th></tr><tr><td>6</td><td>3</td><td>1</td><td>4</td></tr></table></div>
<p>6314 = 6 · 1000 + 3 · 100 + 1 · 10 + 4 · 1</p></div>
<h2>Binärsystem (Basis 2): Probier es aus!</h2>

function ccHTML(c,n){const a=S.cc[c.id];let body;
 if(c.kind==='choice')body=`<div class="opts">${c.opts.map((o,i)=>`<button type="button" class="opt${a?(i===c.ans?' right':(+a.v===i?' wrong':'')):''}" data-cc="${c.id}" data-i="${i}"${a?' disabled':''}>${o}</button>`).join('')}</div>`;
 else body=`<div class="row"><input id="cc-${c.id}" data-ccin="${c.id}" autocomplete="off" inputmode="decimal" aria-label="Antwort"${a?` value="${String(a.v).replace(/"/g,'')}" readonly`:''}>${c.unit?`<span class="unit">${c.unit}</span>`:''}${a?'':`<button type="button" class="btn" data-ccbtn="${c.id}">Abgeben</button>`}</div>`;
 const fb=a?(a.ok?`<div class="fb good"><span class="okmark">Richtig!</span></div>`:`<div class="fb bad"><b>Leider falsch.</b> Richtig ist: <b>${correctText(c)}</b>. ${c.sol}</div>`):'<div class="fb" aria-live="polite"></div>';
 return `<div class="ex${a&&a.ok?' ok':''}${a&&!a.ok?' no':''}" id="ccx-${c.id}"><div class="q"><span class="n">${n}</span>${c.q}</div>${body}${fb}</div>`}
function ccSubmit(id,v){if(S.cc[id])return;const c=EX[id];const r=judge(c,v);
 if(r.empty){const fb=$('#ccx-'+id+' .fb');fb.className='fb info';fb.textContent=r.msg;return}
 S.cc[id]={v:String(v),ok:r.ok};save();const n=CHECKS[c.chk].tasks.findIndex(x=>x.id===id)+1;$('#ccx-'+id).outerHTML=ccHTML(c,n);ccResult(c.chk);if(c.chk==='k1')vaultUpd();renderNav()}
function ccResult(k){const el=document.getElementById('ccRes-'+k);if(!el)return;const C=CHECKS[k];
 if(!selfDone(k)||!ccDone(k)){el.innerHTML=selfDone(k)?`<p style="color:var(--soft)">Abgegeben: ${C.tasks.filter(c=>S.cc[c.id]).length} von ${C.tasks.length}</p>`:'';return}
 const N=C.tasks.length,right=C.tasks.filter(c=>S.cc[c.id].ok).length,q=right/N;
 const msg=right===N?'Perfekt! Du hast alles beim ersten Versuch richtig.':q>=.8?'Sehr gut! Nur kleine Lücken. Schau sie dir unten an.':q>=.5?'Gute Grundlage! Ein paar Dinge solltest du noch üben.':'Hier ist noch einiges zu tun. Wiederhole die markierten Stationen in Ruhe.';
 const rows=C.skills.map((s,i)=>{const cs=C.tasks.filter(c=>c.k===i),r=cs.filter(c=>S.cc[c.id].ok).length,ok=r===cs.length,self=S.self[k+':'+i];
  let note='';if(!ok&&self==='sicher')note='Du warst dir sicher, aber hier hat sich ein Fehler eingeschlichen. Schau noch einmal genau hin.';else if(ok&&self==='noch nicht')note='Besser als gedacht! Du kannst das schon.';
  return `<div class="resrow ${ok?'good':'bad'}"><span class="rdot">${ok?ico('check',''):'!'}</span><div><b>${s.s}</b><small>Deine Einschätzung: ${self} · Im Check: ${r} von ${cs.length} richtig</small>${note?`<small class="rnote">${note}</small>`:''}</div>${ok?'<span class="okmark">sitzt</span>':`<button type="button" class="btn sm" data-go="${s.st}">Nochmal üben</button>`}</div>`}).join('');
 el.innerHTML=`<h2>Dein Ergebnis</h2><div class="card"><div class="big">${right} / ${N}</div><p class="lead" style="margin-top:6px">${msg}</p>${rows}</div>
 <h2>Hefter-Check</h2><p>Sind alle Einträge dieser Stunde in deinem Hefter? Fehlt einer, springe zur Station und hole ihn nach.</p>
 <ul class="hlist">${C.hef.map(id=>`<li><span class="st2${S.hef[id]?' y':''}">${S.hef[id]?ico('check',''):''}</span><span>${HEF[id].title}</span><button type="button" class="btn ghost sm" data-go="${HEF[id].step}">Zur Station</button></li>`).join('')}</ul>
 <div class="card unlock">${ico('star','')}<div><b>Die Profi-Zone ist offen!</b><br>${k==='k1'?'Knifflige Aufgaben und Rätsel warten auf dich.':(k==='k2'?'Bittys Rechenwerk wartet: knifflige Aufgaben, Fehlersuche und Rätsel.':'Ein kniffliger Fall wartet auf dich: Das Lagerfeuer-Video.')}<div class="row"><button type="button" class="btn pro" data-go="${C.profi}">Zur Profi-Zone</button><button type="button" class="btn ghost" data-again="${k}">Check nochmal machen</button></div></div></div>`}

/* ---------- widgets ---------- */
function lamps(id,n,targets,char){const host=document.getElementById(id);if(!host)return;let bits=Array(n).fill(0),ti=0;const got=new Set();
 const draw=()=>{const v=bits.reduce((a,b,i)=>a+b*2**(n-1-i),0);const terms=bits.map((b,i)=>b?2**(n-1-i):0).filter(x=>x);
  const ch=v>=32&&v<=126?String.fromCharCode(v):'–';
  host.innerHTML=`<div class="lamps">${bits.map((b,i)=>`<button type="button" class="bit${b?' on':''}" data-b="${i}" aria-pressed="${!!b}" aria-label="Stellenwert ${2**(n-1-i)}"><span class="pv">${2**(n-1-i)}</span><span class="bulb">${b}</span></button>`).join('')}</div>
  <div class="readout"><span>Binär</span><b>${bits.join('')}<sub>2</sub></b><span>Dezimal</span><b class="dec">${terms.length>1?terms.join(' + ')+' = ':''}${v}</b>${char?`<span>Zeichen</span><span class="charbox">${ch}</span>`:''}</div>
  <div class="chal">${targets.length?`<span>Stelle ein:</span>${targets.map((t,i)=>`<span class="chip${got.has(i)?' got':i===ti?' now':''}">${t.l}</span>`).join('')}`:''}<button type="button" class="btn ghost sm" data-reset="1">Alle aus</button></div>
  <div class="msg" aria-live="polite">${targets.length&&ti>=targets.length?'Alle gefunden. Stark!':''}</div>`;
  if(ti<targets.length&&v===targets[ti].v){got.add(ti);ti++;host.querySelector('.msg').textContent=ti>=targets.length?'Alle gefunden. Stark!':`Richtig! ${targets[ti-1].l} = ${bits.join('')}. Weiter mit ${targets[ti].l}.`;host.querySelectorAll('.chip')[ti-1].className='chip got';if(ti<targets.length)host.querySelectorAll('.chip')[ti].className='chip now'}};
 host.addEventListener('click',e=>{const b=e.target.closest('[data-b]');if(b){bits[+b.dataset.b]^=1;draw();host.querySelector(`[data-b="${b.dataset.b}"]`).focus()}if(e.target.closest('[data-reset]')){bits.fill(0);draw()}});draw();
 host.setBits=v=>{bits=bits.map((_,i)=>(v>>(n-1-i))&1);draw()}}

function gen(id,type){const host=document.getElementById(id);let lvl='b',cur,right=0;
 const neu=(foc)=>{const n=lvl==='b'?rnd(1,15):rnd(16,255);cur=n;host.querySelector('.gq').innerHTML=type==='b2d'?`${bin(n)}<sub>2</sub> = ? <span class="unit">(dezimal)</span>`:`${n} = ? <span class="unit">(binär)</span>`;const i=host.querySelector('input');i.value='';if(foc)i.focus({preventScroll:true});host.querySelector('.fb').className='fb';host.querySelector('.fb').innerHTML=''};
 host.innerHTML=`<div class="seg" style="margin-bottom:8px"><button type="button" data-l="b" aria-pressed="true">4 Bit</button><button type="button" data-l="p" aria-pressed="false">8 Bit</button></div><div class="q gq" style="font-weight:700;font-size:1.15rem"></div><div class="row"><input aria-label="Antwort" autocomplete="off" inputmode="decimal"><button type="button" class="btn" data-g="chk">Prüfen</button><button type="button" class="btn ghost" data-g="new">Neue Aufgabe</button><span class="count gc">Richtig: 0</span></div><div class="fb" aria-live="polite"></div>`;
 const chk=()=>{const v=host.querySelector('input').value.trim();const fb=host.querySelector('.fb');let ok;if(type==='b2d')ok=parseDE(v)===cur;else ok=/^[01]+$/.test(v)&&parseInt(v,2)===cur;
  if(!v){fb.className='fb info';fb.textContent='Gib zuerst eine Antwort ein.';return}
  if(ok){right++;host.querySelector('.gc').textContent='Richtig: '+right;fb.className='fb good';fb.innerHTML='<span class="okmark">Richtig!</span> Klicke auf „Neue Aufgabe“.'}else{fb.className='fb bad';fb.innerHTML='Noch nicht. Lösungsweg: '+(type==='b2d'?b2dText(bin(cur)):d2bText(cur))}};
 host.addEventListener('click',e=>{const l=e.target.closest('[data-l]');if(l){lvl=l.dataset.l;host.querySelectorAll('[data-l]').forEach(b=>b.setAttribute('aria-pressed',b===l));neu(true)}const g=e.target.closest('[data-g]');if(g)g.dataset.g==='chk'?chk():neu(true)});
 host.querySelector('input').addEventListener('keydown',e=>{if(e.key==='Enter')chk()});neu(false)}

function adder(id,n,a0,b0,mode){const host=document.getElementById(id);if(!host)return;let A=a0,B=b0,shown=0;const ov=mode==='ov';
 const bits=v=>Array.from({length:n},(_,i)=>(v>>(n-1-i))&1);
 const calc=()=>{const a=bits(A),b=bits(B);let c=0;const res=[],cin=[],txt=[];for(let k=n-1;k>=0;k--){cin[k]=c;const s=a[k]+b[k]+c;res[k]=s%2;const nc=s>1?1:0;txt.push(`Stelle mit Wert ${2**(n-1-k)}: ${a[k]} + ${b[k]}${c?' + Übertrag 1':''} = ${s>1?bin(s):s} → schreibe <b>${s%2}</b>${nc?', Übertrag <b>1</b>':''}`);c=nc}
  if(c)txt.push(ov?`Der Übertrag müsste in eine 5. Stelle. Die hat der 4-Bit-Rechner nicht → <b>Überlauf!</b>`:`Der letzte Übertrag wird vorne als neue Stelle angeschrieben: <b>1</b>`);return {a,b,res,cin,cout:c,txt}};
 const rand=()=>{let a,b;if(mode==='free'){do{a=rnd(1,14);b=rnd(1,15)&~a&15}while(!b)}else if(mode==='carry'){do{a=rnd(1,14);b=rnd(1,14)}while(!(a&b)||a+b>15)}else{a=rnd(4,15);b=rnd(4,15)}A=a;B=b;shown=0;draw()};
 const draw=()=>{const r=calc(),T=r.txt.length,done=shown>=T;const rev=k=>k>=n-shown;
  const head=`<tr class="head"><td class="lbl">Stellenwert</td><td class="x">${ov?'Überlauf':2**n}</td>${r.a.map((_,k)=>`<td>${2**(n-1-k)}</td>`).join('')}</tr>`;
  const car=`<tr class="car"><td class="lbl">Übertrag</td><td class="x">${shown>=n&&r.cout?'1':''}</td>${r.a.map((_,k)=>`<td>${k<n-1&&rev(k+1)&&r.cin[k]?'1':''}</td>`).join('')}</tr>`;
  const row=(lbl,ab,v)=>`<tr><td class="lbl">${lbl}</td><td class="x"></td>${v.map((d,k)=>`<td><button type="button" class="ab${d?' on':''}" data-ab="${ab}${k}" aria-label="${lbl}, Stellenwert ${2**(n-1-k)}">${d}</button></td>`).join('')}</tr>`;

function stairs(){const U=['Bit','Byte','kB','MB','GB','TB'];const F=$('#cvF'),T=$('#cvT'),Vv=$('#cvV'),st=$('#stairs');const fac=i=>i===1?8:1000;
 F.innerHTML=U.map((u,i)=>`<option value="${i}">${u}</option>`).join('');T.innerHTML=F.innerHTML;F.value='4';T.value='3';
 const draw=()=>{const f=+F.value,t=+T.value,lo=Math.min(f,t),hi=Math.max(f,t);
  st.innerHTML=U.map((u,i)=>`<button type="button" class="stair${i===f?' from':i===t?' to':(i>lo&&i<hi)?' path':''}" data-u="${i}" style="height:${46+i*26}px">${i?`<span class="fac">${fac(i)}</span>`:''}${u}</button>`).join('');
  const v=parseDE(Vv.value);if(isNaN(v)){$('#cvR').textContent='Bitte eine Zahl eingeben.';$('#cvC').textContent='';return}
  let x=v,ch=[`${fmt(v)} ${U[f]}`];
  if(t<f){for(let i=f;i>t;i--){x*=fac(i);ch.push(`· ${fac(i)} = ${fmt(x)} ${U[i-1]}`)}}else{for(let i=f;i<t;i++){x/=fac(i+1);ch.push(`: ${fac(i+1)} = ${fmt(x)} ${U[i+1]}`)}}
  $('#cvR').textContent=`${fmt(v)} ${U[f]} = ${fmt(x)} ${U[t]}`;$('#cvC').textContent=f===t?'Gleiche Einheit, nichts zu rechnen.':`Rechenweg: ${ch.join('  ')} (${t<f?'Treppe hinunter → multiplizieren':'Treppe hinauf → dividieren'})`};
 draw();[F,T].forEach(s=>s.addEventListener('change',draw));Vv.addEventListener('input',draw);

 else if(b=t.closest('.pjump')){e.preventDefault();const tg=document.querySelector(b.getAttribute('href'));tg&&tg.scrollIntoView({behavior:'smooth'})}
 else if(b=t.closest('[data-guess]')){S.guess=+b.dataset.guess;save();document.querySelectorAll('[data-guess]').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#guessNote').innerHTML=guessNote()}
 else if(b=t.closest('[data-self]')){const k=b.dataset.self.split(':')[0];const was=selfDone(k);S.self[b.dataset.self]=b.dataset.v;save();b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));if(!was&&selfDone(k)){$('#ccArea-'+k).innerHTML=ccArea(k);$('#ccArea-'+k).scrollIntoView({behavior:'smooth',block:'start'})}ccResult(k);renderNav()}
 else if(b=t.closest('[data-fs]')){S.fs=+b.dataset.fs;save();document.documentElement.style.setProperty('--fs',S.fs+'px');b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))}});
document.addEventListener('keydown',e=>{const d=e.target.dataset;if(e.key!=='Enter'||!d)return;if(d.in)check(d.in,e.target.value);else if(d.ccin)ccSubmit(d.ccin,e.target.value)});
document.addEventListener('change',e=>{const id=e.target.dataset&&e.target.dataset.hef;if(id){S.hef[id]=e.target.checked;save();e.target.closest('.hef').classList.toggle('done',e.target.checked);renderNav()}});
const fromHash=()=>{const m=location.hash.match(/^#schritt-(\d+)$/);return m?+m[1]-1:null};
window.addEventListener('hashchange',()=>{const h=fromHash();if(h!==null&&h!==S.step)go(h)});
const h0=fromHash();go(h0!==null?h0:Math.min(S.step,STEPS.length-1),true);
}
</script>
</body>
