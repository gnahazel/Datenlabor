<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Datenlabor Bit Byte Einheiten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE everyday learning for 12-year-olds: friendly, clear, calm working surface
   IDEA a metro map through the lab: each step is a station, Teil 1 blue line, Teil 2 red line
   PICTURE the live widget of each station (bit lamps, safe, unit staircase, storage bar) drawn large
   COLOUR white ground, metro blue and red per part, amber lined paper for Hefter tasks, green for Basis/correct
   TYPE Figtree 800 for titles, Figtree 400/600 for text
   LAYOUT laptop: metro line left, station content right, pager bottom; phone: content only, metro as drawer */
:root{color-scheme:light dark;--fs:17px;--bg:light-dark(#ffffff,#0e1116);--ink:light-dark(#151821,#eef1f6);--soft:light-dark(#596072,#a7aebd);--line:light-dark(#dde2ea,#2b313d);--panel:light-dark(#f3f5f9,#161a22);--blue:light-dark(#0a5cff,#5b8cff);--red:light-dark(#e6261f,#ff5d55);--amber:#ffb400;--paper:light-dark(#fff7dc,#2a2414);--pline:light-dark(#f0dca0,#4a3f22);--green:light-dark(#00975a,#2ecc85);--gsoft:light-dark(#e3f6ec,#123224);--bad:light-dark(#c0261c,#ff7a70);--bsoft:light-dark(#fde8e6,#3a1714);--part:var(--blue);--pro:light-dark(#1f2638,#3d4866);--violet:light-dark(#6a3fd0,#8a66f0)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html{font-size:var(--fs);scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.55 Figtree,system-ui,sans-serif;overflow-x:clip}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
h1,h2,h3{line-height:1.1;letter-spacing:-.02em;margin:0;text-wrap:balance}
h1{font-size:clamp(1.9rem,4vw,2.6rem);font-weight:800}
h2{font-size:1.35rem;font-weight:800;margin-top:1.6rem}
h3{font-size:1.08rem;font-weight:800}
p{margin:.5rem 0;max-width:68ch}
sub{font-size:.7em}
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;padding:8px max(16px,3vw)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{width:38px;height:38px;flex:none}
.brand b{font-size:1.15rem;font-weight:800;display:block;line-height:1.1}
.brand span{font-size:.8rem;color:var(--soft)}
.tbtn{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-weight:600}
.tbtn:hover{border-color:var(--soft)}
#stepsBtn{display:none}
.lk2{display:none}
.prog{display:flex;gap:3px;padding:0 max(16px,3vw) 8px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.prog i{background:color-mix(in srgb,var(--c) 28%,var(--line))}
.prog i.ok{background:var(--c)}
.prog i.cur{outline:2px solid var(--ink);outline-offset:1px}
.wrap{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1240px;margin:0 auto}
.metro{position:sticky;top:80px;align-self:start;padding:22px 10px 22px max(16px,2vw);max-height:calc(100vh - 80px);overflow:auto}
.mpart{font-size:.82rem;font-weight:800;margin:6px 0 6px 2px;color:var(--soft)}
.mpart.t1{color:var(--blue)}.mpart.t2{color:var(--red);margin-top:14px}
.st{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;border:0;background:none;text-align:left;padding:4px 6px;border-radius:10px;position:relative}
.st:hover{background:var(--panel)}
.st .dot{width:22px;height:22px;border-radius:50%;border:4px solid var(--c);background:var(--bg);flex:none;position:relative;z-index:1;display:grid;place-items:center}
.st::before{content:"";position:absolute;left:15px;top:-6px;bottom:-6px;width:6px;background:var(--c)}
.st.first::before{top:50%}.st.last::before{bottom:50%}
.st.ok .dot{background:var(--c)}
.st.ok .dot svg{width:12px;height:12px;color:#fff}
.st .dot svg{width:11px;height:11px;color:var(--c)}
.st.cur .dot{transform:scale(1.25);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 25%,transparent)}
.st.cur{font-weight:800;background:var(--panel)}
.st small{display:block;color:var(--soft);font-size:.8rem;font-weight:400}
main{padding:22px max(16px,3vw) 120px;max-width:900px}
.kicker{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:.85rem;font-weight:600;background:var(--panel);border:1px solid var(--line);white-space:nowrap}
.tag.part{background:var(--part);color:#fff;border-color:transparent}
.bitty{display:flex;gap:12px;align-items:flex-start;margin:16px 0}
.bitty svg{width:56px;height:56px;flex:none}
.bitty p{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:10px 14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.lead{font-size:1.1rem}
.ic{width:20px;height:20px;flex:none;vertical-align:-4px}
/* Hefter */
.hef{margin:18px 0;border-radius:6px 14px 14px 6px;background:var(--paper);background-image:repeating-linear-gradient(transparent 0 calc(1.55em - 1px),var(--pline) calc(1.55em - 1px) 1.55em);border:2px solid var(--amber);padding:14px 16px 12px 46px;position:relative}
.hef::before{content:"";position:absolute;left:14px;top:12px;bottom:12px;width:14px;background:radial-gradient(circle at 7px 7px,var(--bg) 4px,transparent 5px) 0 0/14px 26px repeat-y}
.hef .hh{display:flex;align-items:center;gap:8px;font-weight:800;color:light-dark(#7a5200,#ffcf5a);margin-bottom:4px}
.hef .task{font-weight:600;margin:0 0 8px}
.hef .copy{background:var(--bg);border:1px dashed var(--pline);border-radius:8px;padding:10px 14px}
.hef .copy h3{margin-bottom:4px;text-decoration:underline;text-underline-offset:3px}
.hef ol,.hef ul{margin:.3rem 0;padding-left:1.3rem}
.chk{display:flex;align-items:center;gap:10px;margin-top:10px;min-height:44px;font-weight:600;cursor:pointer}
.chk input{width:24px;height:24px;accent-color:var(--green)}
.hef.done{border-color:var(--green)}
/* levels */
.lvl{display:flex;align-items:center;gap:10px;margin:26px 0 8px}
.lvl .badge{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#fff;flex:none}
.lvl .badge svg{width:20px;height:20px}
.lvl small{display:block;color:var(--soft);font-weight:400;font-size:.88rem}
.count{margin-left:auto;font-weight:800;white-space:nowrap;color:var(--green)}
.profi{margin:26px 0;border:2px solid var(--ink);border-radius:14px;overflow:hidden}
.pz-toggle{width:100%;display:flex;align-items:center;gap:12px;padding:12px 16px;border:0;background:var(--ink);color:var(--bg);text-align:left;min-height:56px}
.pz-toggle svg{width:24px;height:24px;flex:none;color:var(--amber)}
.pz-toggle b{font-size:1.05rem}
.pz-toggle small{display:block;opacity:.8}
.pz-toggle .arr{margin-left:auto;font-size:1.3rem;transition:transform .2s}
.pz-toggle[aria-expanded=true] .arr{transform:rotate(180deg)}
.pz-toggle.ready{animation:pulse 1.6s ease-in-out 3}
@keyframes pulse{50%{box-shadow:inset 0 0 0 4px var(--amber)}}
.pz-body{padding:4px 16px 16px}
/* exercises */
.ex{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;background:var(--bg)}
.ex .q{font-weight:600}
.ex .q .n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--panel);border:1px solid var(--line);font-size:.85rem;margin-right:6px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.row input{width:11em;min-height:44px;padding:6px 10px;border:2px solid var(--line);border-radius:10px;background:var(--bg);font-size:1.05rem;font-variant-numeric:tabular-nums}
.row input:focus{border-color:var(--part)}
.unit{font-weight:600;white-space:nowrap}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:0;background:var(--part);color:#fff;font-weight:700}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:38px;padding:0 12px;font-size:.9rem}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.opt{min-height:44px;padding:6px 14px;border-radius:10px;border:2px solid var(--line);background:var(--bg);font-weight:600;text-align:left}
.opt:hover{border-color:var(--part)}
.opt.right{border-color:var(--green);background:var(--gsoft)}
.opt.wrong{border-color:var(--bad);background:var(--bsoft)}
.fb{margin-top:8px;border-radius:8px}
.fb:empty{display:none}
.fb.good{background:var(--gsoft);padding:8px 12px}
.fb.bad{background:var(--bsoft);padding:8px 12px}
.fb.info{background:var(--panel);padding:8px 12px;border:1px solid var(--line)}
.help{display:flex;gap:8px;margin-top:6px}
.help:empty{display:none}
.ex.ok{border-color:var(--green);background:color-mix(in srgb,var(--gsoft) 45%,var(--bg))}
.ex.ok input{border-color:var(--green)}
.okmark{color:var(--green);font-weight:800}
/* tables */
.scroll{overflow-x:auto}
table.pv{border-collapse:collapse;margin:10px 0;font-variant-numeric:tabular-nums}
table.pv td,table.pv th{border:2px solid var(--line);padding:6px 12px;text-align:center;min-width:46px}
table.pv th{background:var(--panel);font-size:.9rem}
table.pv td.one{background:color-mix(in srgb,var(--part) 18%,var(--bg));font-weight:800}
.plan{border-collapse:collapse;width:100%}
.plan td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.plan td:first-child{white-space:nowrap;font-weight:800;width:5.5em}
/* lamps */
.lab{background:light-dark(#10182b,#0a0e18);color:#eef1f6;border-radius:16px;padding:18px;margin:14px 0}
.lamps{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.bit{width:64px;border:0;background:none;color:inherit;display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px}
.bulb{width:52px;height:52px;border-radius:50%;background:#2a3348;border:3px solid #3b4762;display:grid;place-items:center;font-size:1.5rem;font-weight:800;transition:background .15s,box-shadow .15s}
.bit.on .bulb{background:#ffd23f;border-color:#fff1b8;color:#2a1d00;box-shadow:0 0 22px #ffd23f88}
.bit .pv{font-size:.9rem;font-weight:700;color:#9fb0d0}
.readout{display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:center;align-items:baseline;margin-top:14px;font-variant-numeric:tabular-nums}
.readout b{font-size:clamp(1.6rem,5vw,2.3rem);font-weight:800}
.readout span{color:#9fb0d0}
.chal{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px;align-items:center}
.chip{padding:6px 12px;border-radius:99px;border:2px solid #3b4762;font-weight:700;white-space:nowrap}
.chip.now{border-color:#ffd23f;color:#ffd23f}
.chip.got{background:#1f7a4d;border-color:#1f7a4d}
.lab .msg{text-align:center;margin-top:8px;min-height:1.6em;color:#c9f5dd;font-weight:600}
.lab .btn.ghost{background:#222b40;color:#eef1f6;border-color:#3b4762}
.charbox{display:grid;place-items:center;width:70px;height:70px;border-radius:12px;background:#fff;color:#10182b;font-size:2.4rem;font-weight:800}
/* stepper */
.steps{list-style:none;padding:0;margin:10px 0}
.steps li{padding:8px 12px;border-left:4px solid var(--part);background:var(--bg);margin:6px 0;border-radius:0 8px 8px 0;font-variant-numeric:tabular-nums}
.steps li b.y{color:var(--green)}.steps li b.n{color:var(--bad)}
/* vault */
.vault{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:18px;align-items:center}
.vault svg{width:100%;height:auto}
.door{transition:transform .9s ease,opacity .9s;transform-origin:26px 100px;transform-box:view-box}
.open .door{transform:scaleX(.06);opacity:.35}
/* stairs */
.stairs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;align-items:end;margin:40px 0 6px}
.stair{border:0;border-radius:8px 8px 0 0;background:color-mix(in srgb,var(--red) 16%,var(--bg));border:2px solid color-mix(in srgb,var(--red) 40%,var(--bg));display:flex;flex-direction:column;justify-content:flex-start;align-items:center;padding:8px 2px;position:relative;font-weight:800;font-size:clamp(.85rem,2.4vw,1.1rem)}
.stair .fac{position:absolute;top:-30px;left:-14px;font-size:.78rem;background:var(--ink);color:var(--bg);border-radius:99px;padding:2px 7px;white-space:nowrap;z-index:1}
.stair.path{background:color-mix(in srgb,var(--red) 40%,var(--bg))}
.stair.from,.stair.to{background:var(--red);color:#fff;border-color:var(--red)}
.slegend{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:600;font-size:.92rem}
.conv{display:grid;grid-template-columns:repeat(auto-fit,minmax(9em,1fr));gap:10px;margin-top:12px}
.conv label{font-size:.88rem;font-weight:600;color:var(--soft);display:flex;flex-direction:column;gap:4px}
.conv input,.conv select{min-height:44px;padding:6px 10px;border:2px solid var(--line);border-radius:10px;background:var(--bg);font-size:1rem}
.result{font-size:clamp(1.5rem,5vw,2.2rem);font-weight:800;margin-top:12px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.chain{color:var(--soft);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.switch{display:flex;align-items:center;gap:8px;font-weight:600;min-height:44px}
.switch input{width:22px;height:22px;accent-color:var(--ink)}
/* mission */
.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(12em,1fr));gap:10px;margin:12px 0}
.item{display:flex;gap:12px;align-items:center;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);text-align:left}
.item svg{width:38px;height:38px;flex:none;color:var(--red)}
.item b{display:block}
.item small{color:var(--soft)}
button.item[aria-pressed=true]{border-color:var(--red);background:color-mix(in srgb,var(--red) 10%,var(--bg))}
.media{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}
.medium{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border:2px solid var(--line);border-radius:12px;background:var(--bg);text-align:center}
.medium svg{width:46px;height:46px;color:var(--ink)}
.medium small{color:var(--soft);white-space:nowrap}
button.medium[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.meter{height:34px;border-radius:10px;background:var(--bg);border:2px solid var(--ink);overflow:hidden;position:relative;margin-top:10px}
.meter i{display:block;height:100%;background:var(--green);transition:width .3s}
.meter.full i{background:var(--bad)}
.mstat{font-weight:800;margin-top:8px;font-size:1.1rem}
/* final */
.selfrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.seg{display:flex;gap:4px}
.seg button{min-height:40px;padding:0 10px;border:2px solid var(--line);border-radius:8px;background:var(--bg);font-size:.88rem;font-weight:600}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hlist{list-style:none;padding:0}
.hlist li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.hlist .st2{width:26px;height:26px;border-radius:50%;border:2px solid var(--amber);display:grid;place-items:center;flex:none}
.hlist .st2.y{background:var(--green);border-color:var(--green);color:#fff}
.hlist .st2 svg{width:14px;height:14px}
.hlist button{margin-left:auto}
.big{font-size:clamp(2rem,6vw,3rem);font-weight:800;line-height:1}

.opt.pick[aria-pressed=true]{border-color:var(--part);background:color-mix(in srgb,var(--part) 14%,var(--bg));box-shadow:inset 0 0 0 2px var(--part);animation:pop .25s ease}
.opt.pick[aria-pressed=true]::before{content:"✓ ";font-weight:800;color:var(--part)}
@keyframes pop{50%{transform:scale(1.07)}}
.seg button[aria-pressed=true]{animation:pop .2s ease}
.lockcard{display:flex;gap:12px;align-items:flex-start;color:var(--soft)}
.lockcard .ic{width:26px;height:26px;color:var(--ink);flex:none}
.ex.no{border-color:var(--bad)}
.resrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.resrow small{display:block;color:var(--soft)}
.resrow .rnote{color:var(--ink);font-style:italic}
.rdot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800}
.rdot svg{width:16px;height:16px}
.resrow.good .rdot{background:var(--green)}.resrow.bad .rdot{background:var(--bad)}
.unlock{display:flex;gap:14px;align-items:flex-start;background:var(--pro);color:#fff;border:0}
.unlock>svg{width:34px;height:34px;color:var(--amber);flex:none}
.unlock .btn.ghost{background:transparent;color:#fff;border-color:#ffffff66}
.btn.pro{background:var(--amber);color:#151821}
.story .note{background:var(--paper);border-radius:10px;padding:10px 14px;font-style:italic}
.stage{border:2px solid var(--line);border-radius:14px;padding:4px 16px 12px;margin:18px 0}
.stage.sdone{border-color:var(--green)}
.stage.locked{opacity:.75}
.stagehead{display:flex;gap:12px;align-items:center}
.stagehead h2{margin-top:12px}
.stagehead small{color:var(--soft);font-weight:600}
.snum{width:38px;height:38px;border-radius:50%;background:var(--pro);color:var(--amber);display:grid;place-items:center;font-weight:800;flex:none;margin-top:10px}
.stage.sdone .snum{background:var(--green);color:#fff}
@media(max-width:600px){.resrow{grid-template-columns:auto minmax(0,1fr)}.resrow>:last-child{grid-column:2}.unlock{flex-direction:column}}

.beamer .dlg{max-width:980px}
.beamer .bit{width:110px}.beamer .bulb{width:90px;height:90px;font-size:2.6rem}.beamer .bit .pv{font-size:1.4rem}
.plq{font-size:clamp(1.4rem,3.5vw,2.2rem);font-weight:700;margin:12px 0;min-height:1.4em}
.goals li{font-size:1.15rem;margin:4px 0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(12em,1fr));gap:10px;margin:14px 0}
.pjump{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--pro);color:#fff;text-decoration:none;min-height:56px}
.pjump svg{width:24px;height:24px;color:var(--amber);flex:none}
.pjump small{display:block;opacity:.8}
table.abc td,table.abc th{min-width:30px;padding:4px 6px;font-size:.88rem}

.rules{display:flex;flex-wrap:wrap;gap:10px}
.rules span{padding:10px 16px;border-radius:10px;background:var(--bg);border:2px solid var(--line);font-size:1.2rem;font-variant-numeric:tabular-nums}
.rules span small{font-size:.85rem;color:var(--soft)}
.rules span.later{border-style:dashed;color:var(--soft)}
.addt{border-collapse:collapse;margin:0 auto;font-variant-numeric:tabular-nums}
.addt td{width:56px;height:52px;text-align:center;font-size:1.6rem;font-weight:800}
.addt td.lbl{width:auto;text-align:right;padding-right:14px;font-size:.9rem;color:#9fb0d0;font-weight:600;white-space:nowrap}
.addt tr.head td{font-size:.85rem;color:#9fb0d0;height:28px;font-weight:700}
.addt tr.car td{font-size:1.05rem;color:#ffd23f;height:26px}
.addt tr.car td.lbl{font-size:.9rem;color:#ffd23f}
.addt tr.res td{border-top:3px solid #eef1f6}
.addt tr.res td.lbl{border-top:0}
.addt td.q{color:#5b6683}
.addt td.x{color:#9fb0d0}
.addt.ovmode td.x{border:2px dashed #ff7a70;border-width:0 2px;background:#ff5d5512}
.addt.ovmode tr.head td.x{border-top-width:2px;font-size:.72rem;color:#ff9d96}
.addt.ovmode tr.res td.x{border-bottom-width:2px;border-top:3px solid #eef1f6}
.addt td.ovc{color:#ff7a70}
.ab{width:46px;height:46px;border-radius:10px;border:2px solid #3b4762;background:#2a3348;color:#eef1f6;font:inherit;font-size:1.4rem;font-weight:800;cursor:pointer}

<script>
{
const $=s=>document.querySelector(s);
const ico=(n,c='ic')=>`<svg class="${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const fmt=x=>Number(x).toLocaleString('de-DE',{maximumFractionDigits:4});
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='bbe-v2',HKEY='bbe-host-v1',PREFIX='datenlabor-bbe-',ALPH='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const genCode=n=>Array.from({length:n},()=>ALPH[Math.floor(Math.random()*ALPH.length)]).join('');
const fresh=()=>({step:0,done:{},tries:{},hef:{},sc:{},cc:{},seen:{},fs:17,gen:null,join:null,cele:{},sortcur:{},matchcur:{}});
let S=fresh();
try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r)S=Object.assign(S,r)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){};sendState()};
document.documentElement.style.setProperty('--fs',S.fs+'px');
const parseDE=s=>{s=String(s).trim().replace(/\s/g,'');if(!s)return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');return Number(s)};
const norm=s=>String(s).trim().toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/\s+/g,'');
const say=t=>`<div class="bitty"><svg aria-hidden="true"><use href="#i-bitty"/></svg><p>${t}</p></div>`;
const BU=['Bit','Byte','KiB','MiB','GiB','TiB'],BS=[1,8,8192,8388608,8589934592,8796093022208],bfac=i=>i===1?8:1024,UN=['Byte','KiB','MiB','GiB'];
const fmtInt=n=>BigInt(Math.round(n)).toLocaleString('de-DE');

/* ---------- random tasks per student ---------- */
function makeGen(){const w=shuffle(['SCHULE','KLASSE','LEHRER','PAUSE','TAFEL','HEFTER','COMPUTER','SPEICHER','INFORMATIK','FERIEN']);
 const v=shuffle([2,3,4,5,6,7,8,9]),k=pick([2,3]);
 const sortItems=[[`1 ${k===2?'MB':'GB'}`,1000**k],[`1 ${k===2?'MiB':'GiB'}`,1024**k],[`1000 ${k===2?'KiB':'MiB'}`,1000*1024**(k-1)],[`${1000+(k===2?rnd(5,20):rnd(5,40))} ${k===2?'kB':'MB'}`,0]];
 sortItems[3][1]=parseInt(sortItems[3][0])*1000**(k-1);
 const g={perm:{},
  warm:[rnd(30,127),rnd(128,255)],
  byte:{n1:rnd(2,9),m2:8*rnd(2,10),w3:w[0],w4:w[1],a5:rnd(1,5),b5:rnd(1,7)},
  st:{d1:{i:rnd(3,5),down:Math.random()<.5},c2:{i:rnd(2,4),n:rnd(2,8)},c3:{i:rnd(3,5),n:rnd(2,8)},
   match:[[`${v[0]} KiB`,`${v[0]*1024} Byte`],[`${v[1]} MiB`,`${v[1]*1024} KiB`],[`${v[2]} GiB`,`${v[2]*1024} MiB`],[`${v[3]*1024} KiB`,`${v[3]} MiB`]],mperm:shuffle([0,1,2,3]),
   sort:sortItems},
  f:{abl:rnd(150,400),elt:rnd(100,250),kfo:rnd(50,95)/10,sel:rnd(20,45)/10,vid:rnd(12,26)/10,tra:rnd(80,200),s1:rnd(3,6),s2:rnd(5,9),cd:pick(['vid','tra'])},
  ex:{t2:rnd(20,90),t5:rnd(2,9),t6:pick([2,4,8])},
  pr:{p1:rnd(1,6)+.5,p3:rnd(2,9)}};
 const sortStart=a=>{let p;do{p=shuffle(a.map((_,i)=>i))}while(p.every((x,i)=>i===0||a[p[i-1]][1]<=a[x][1]));return p};
 g.st.sstart=sortStart(g.st.sort);
 const fs=[['Elternbrief.pdf',g.f.elt,1],['Selfie.jpg',g.f.sel,2],['Song2.mp3',g.f.s2,2],['Erinnerungsvideo.mp4',g.f.vid,3]];g.f.sortItems=fs.map(x=>[`${x[0]} (${fmt(x[1])} ${UN[x[2]]})`,x[1]*1024**x[2]]);g.f.sstart=sortStart(g.f.sortItems);
 return g}
if(!S.gen){S.gen=makeGen();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const G=S.gen;
function CH(id,opts,ans){let p=G.perm[id];if(!p||p.length!==opts.length){p=shuffle(opts.map((_,i)=>i));G.perm[id]=p}return {opts:p.map(i=>opts[i]),ans:p.indexOf(ans)}}

/* ---------- exercises ---------- */
const EX={};
function E(kind,id,q,ans,x={}){if(kind==='choice'){const c=CH(id,x.opts,ans);x.opts=c.opts;ans=c.ans}EX[id]=Object.assign({kind,id,q,ans},x);return id}
function exHTML(id,n){const d=EX[id];let body;
 if(d.kind==='choice')body=`<div class="opts">${d.opts.map((o,i)=>`<button type="button" class="opt" data-choice="${id}" data-i="${i}">${o}</button>`).join('')}</div>`;
 else if(d.kind==='match'){const cur=S.matchcur[id]||[];body=`<div class="match">${d.left.map((l,i)=>`<div class="mrow" data-mrow="${i}"><span class="ml">${l}</span><span class="marr">=</span><select data-match="${id}" data-i="${i}" aria-label="${l} zuordnen"><option value="">bitte wählen</option>${d.right.map((r,j)=>`<option value="${j}"${cur[i]==j&&cur[i]!==''&&cur[i]!=null?' selected':''}>${r}</option>`).join('')}</select></div>`).join('')}</div><div class="row"><button type="button" class="btn" data-check="${id}">Prüfen</button></div>`}
 else if(d.kind==='sort'){body=`<ol class="sortl" id="sl-${id}">${sortList(id)}</ol><div class="row"><button type="button" class="btn" data-check="${id}">Prüfen</button></div>`}
 else body=`<div class="row"><input id="in-${id}" data-in="${id}" autocomplete="off" spellcheck="false" inputmode="${d.kind==='text'?'text':'decimal'}" aria-label="Antwort">${d.unit?`<span class="unit">${d.unit}</span>`:''}${d.kind==='num'?`<button type="button" class="calcb" data-calc="in-${id}" title="Taschenrechner" aria-label="Taschenrechner öffnen">${ico('calc','')}</button>`:''}<button type="button" class="btn" data-check="${id}">Prüfen</button></div>`;
 return `<div class="ex" id="ex-${id}"><div class="q">${n?`<span class="n">${n}</span>`:''}${d.q}</div>${body}<div class="fb" aria-live="polite"></div><div class="help"></div></div>`}
function sortList(id){const d=EX[id];const cur=S.sortcur[id]||d.start;const L=cur.length;return cur.map((ix,p)=>`<li><span class="sl">${d.items[ix][0]}</span><span class="sbtns"><button type="button" class="sb" data-sort="${id}" data-p="${p}" data-d="-1" aria-label="nach oben"${p===0?' disabled':''}>▲</button><button type="button" class="sb" data-sort="${id}" data-p="${p}" data-d="1" aria-label="nach unten"${p===L-1?' disabled':''}>▼</button></span></li>`).join('')}
const exList=(ids,o=0)=>ids.map((id,i)=>exHTML(id,i+1+o)).join('');
function correctText(d){if(d.kind==='choice')return d.opts[d.ans];if(d.kind==='text')return d.ans[0].toUpperCase();if(d.kind==='match'||d.kind==='sort')return '';return fmt(d.ans)}
function judge(d,v){
 if(d.kind==='choice')return {ok:+v===d.ans};
 if(d.kind==='match'){if(v.some(x=>x===''||x==null))return {ok:false,msg:'Ordne zuerst jeder Angabe etwas zu.',empty:1};return {ok:v.every((x,i)=>+x===d.ans[i]),wrong:v.map((x,i)=>+x!==d.ans[i])}}
 if(d.kind==='sort'){const vals=v.map(i=>d.items[i][1]);return {ok:vals.every((x,i)=>i===0||vals[i-1]<x)}}
 if(d.kind==='text'){if(!String(v).trim())return {ok:false,msg:'Gib zuerst eine Antwort ein.',empty:1};return {ok:d.ans.map(norm).includes(norm(v))}}
 if(String(v).trim()==='')return {ok:false,msg:'Gib zuerst eine Antwort ein.',empty:1};const x=parseDE(v);if(isNaN(x))return {ok:false,msg:'Das ist keine Zahl. Schreibe nur Ziffern (Komma ist erlaubt).',empty:1};
 return {ok:Math.abs(x-d.ans)<=(d.tol||1e-9)}}
function readVal(id){const d=EX[id];if(d.kind==='match')return [...document.querySelectorAll(`[data-match="${id}"]`)].map(s=>s.value);if(d.kind==='sort')return S.sortcur[id]||d.start;const i=$('#in-'+id);return i?i.value:''}
function check(id,v,btn){const d=EX[id];const el=$('#ex-'+id);if(!el||S.done[id])return;
 const r=judge(d,v);const fb=el.querySelector('.fb');
 if(r.empty){fb.className='fb info';fb.textContent=r.msg;return}
 if(d.kind==='match')el.querySelectorAll('.mrow').forEach((m,i)=>m.classList.toggle('bad',!!(r.wrong&&r.wrong[i])));
 if(r.ok){S.done[id]=1;save();if(btn)btn.classList.add('right');solved(id,true);update();return}
 S.tries[id]=(S.tries[id]||0)+1;save();if(btn)btn.classList.add('wrong');
 fb.className='fb bad';fb.innerHTML=(d.kind==='match'?'Rot markierte Zuordnungen stimmen noch nicht. ':d.kind==='sort'?'Die Reihenfolge stimmt noch nicht. ':'')+['Versuch es noch einmal!','Schau dir den Tipp an.','Du kannst dir die Lösung zeigen lassen.'][Math.min(S.tries[id]-1,2)];
 helpBtns(id)}
function helpBtns(id){const d=EX[id],t=S.tries[id]||0,el=$('#ex-'+id);if(!el)return;const h=el.querySelector('.help');let s='';
 if(t>=1&&d.hint)s+=`<button type="button" class="btn ghost sm" data-hint="${id}">Tipp</button>`;
 if(t>=2)s+=`<button type="button" class="btn ghost sm" data-sol="${id}">Lösung zeigen</button>`;h.innerHTML=s}
function solved(id,isNew){const d=EX[id],el=$('#ex-'+id);if(!el)return;el.classList.add('ok');
 const inp=el.querySelector('input');if(inp){if(!inp.value)inp.value=correctText(d);inp.readOnly=true}
 const b=el.querySelector('[data-check]');if(b)b.remove();const cb=el.querySelector('.calcb');if(cb)cb.remove();
 if(d.kind==='choice')el.querySelectorAll('.opt').forEach(b=>{if(+b.dataset.i===d.ans)b.classList.add('right');b.disabled=true});
 if(d.kind==='match')el.querySelectorAll('select').forEach((s,i)=>{s.value=d.ans[i];s.disabled=true;s.closest('.mrow').classList.remove('bad')});
 if(d.kind==='sort'){S.sortcur[id]=d.items.map((_,i)=>i).sort((a,b)=>d.items[a][1]-d.items[b][1]);$('#sl-'+id).innerHTML=sortList(id);el.querySelectorAll('.sb').forEach(b=>b.disabled=true)}
 const fb=el.querySelector('.fb');fb.className='fb good';fb.innerHTML=`<span class="okmark">${isNew?pick(['Richtig!','Super!','Stark!','Genau!']):'Erledigt.'}</span> ${d.sol||''}`;el.querySelector('.help').innerHTML=''}

/* ---------- Arbeitsblatt ---------- */
const HEF={h4:{step:'byte',title:'Bit und Byte',ab:1},h5:{step:'stairs',title:'Einheiten und Präfixe',ab:2},h6:{step:'store',title:'Dateigrößen im Vergleich',ab:3}};
function hef(id,copy){const H=HEF[id];return `<div class="hef${S.hef[id]?' done':''}" id="hef-${id}"><div class="hh">${ico('book')} Arbeitsblatt-Auftrag</div><p class="task">Ergänze auf deinem Arbeitsblatt im <b>Kasten ${H.ab} „${H.title}“</b> die Lücken. Die <mark>markierten</mark> Wörter gehören in die Lücken.</p><div class="copy"><h3>Kasten ${H.ab}: ${H.title}</h3>${copy}</div><label class="chk"><input type="checkbox" data-hef="${id}"${S.hef[id]?' checked':''}> Erledigt: Die Lücken auf meinem Arbeitsblatt sind ausgefüllt.</label></div>`}

/* ---------- self-checks ---------- */
const SC={warm:['Ich kann Zahlen mit der 8-Bit-Stellenwerttafel darstellen.'],byte:['Ich weiß, was ein Bit und ein Byte ist.','Ich kann zwischen Bit und Byte umrechnen.'],stairs:['Ich kann SI- und Binärpräfixe unterscheiden.','Ich kann mit der Einheitentreppe umrechnen.'],store:['Ich kann einschätzen, wie viel Speicher verschiedene Dateien brauchen.','Ich kann entscheiden, auf welchen Speicher Daten passen.']};
const RATE=['sicher','fast','noch nicht'];
const SCALL=Object.entries(SC).flatMap(([k,a])=>a.map((t,i)=>({key:k+':'+i,t})));

/* ---------- steps ---------- */
const STEPS=[];
const step=o=>{o.b=o.b||[];o.h=o.h||[];o.sc=SC[o.key]?SC[o.key].map((_,i)=>o.key+':'+i):[];STEPS.push(o)};

${say('Hallo, ich bin <b>Bitty</b>! Heute findest du heraus, wie viel Speicher Daten brauchen. Dafür brauchst du die Stellenwerttafel mit <b>8 Stellen</b>. Weißt du noch, wie sie funktioniert?')}
<div class="card legend"><span><span class="badge">${ico('base','')}</span><b>Basis-Aufgaben</b> löst du alle</span><span><span class="lg-ab">${ico('book')}</span><b>Arbeitsblatt-Auftrag</b>: Lücken ausfüllen, dann Haken setzen</span><span><span class="lg-sc">?</span><b>Selbstcheck</b>: Am Ende jeder Station schätzt du dich ein</span><span><span class="lg-pro">${ico('star','ic')}</span><b>Profi-Zone</b> öffnet sich nach dem Exit-Check</span></div>
<div class="card"><h3>Kurz wiederholt</h3><p style="margin-top:0">Jede Stelle hat einen Stellenwert. Von rechts nach links verdoppelt er sich. Eine <b>1</b> heißt: Der Stellenwert zählt mit. Eine <b>0</b> heißt: Er zählt nicht mit.</p>
<div class="scroll"><table class="pv"><tr><th>128</th><th>64</th><th>32</th><th>16</th><th>8</th><th>4</th><th>2</th><th>1</th></tr></table></div></div>
<h2>Probier es aus</h2>
<p>Schalte die Lampen an und aus. <b>So rechnest du:</b> Jede Lampe, die leuchtet, steht für eine 1. Ihre Zahl darüber wird <b>dazugezählt</b>. Lampen, die aus sind, zählen nicht mit. Leuchten zum Beispiel die Lampen über 8, 4 und 1, ist die Zahl 8 + 4 + 1 = <b>13</b>. Unter den Lampen rechnet Bitty mit, damit du dich kontrollieren kannst.</p>
${lvlHead('warm')}
<div class="card" style="margin-top:0"><b>Übung:</b> Stelle nacheinander diese Zahlen mit den Lampen ein. Sobald es stimmt, wird die Zahl grün.<br>1) die Zahl <b>${G.warm[0]}</b> &nbsp;&nbsp; 2) die Zahl <b>${G.warm[1]}</b></div>
<div class="lab" id="lampW"></div>${scSlot('warm')}`,

    E('num','b4',`Wie viele <b>Bit</b> braucht das Wort <b>${gb.w4}</b>?`,gb.w4.length*8,{unit:'Bit',hint:'Erst Buchstaben zählen (= Byte), dann mal 8.',sol:`${gb.w4} hat ${gb.w4.length} Zeichen: ${gb.w4.length} Byte = ${gb.w4.length*8} Bit.`}),
    E('num','b5',`${gb.a5} Byte und ${gb.b5} Bit sind zusammen wie viele Bit?`,gb.a5*8+gb.b5,{unit:'Bit',hint:'Rechne zuerst die Byte in Bit um, dann addiere.',sol:`${gb.a5} · 8 + ${gb.b5} = ${gb.a5*8+gb.b5} Bit.`})],

 render:()=>`
<h1>Bit und Byte</h1>
${say('Ein einzelnes Bit kann nur 0 oder 1 sein. Das ist ziemlich wenig. Darum fasse ich immer <b>8 Bit</b> zu einem Paket zusammen. Dieses Paket heißt <b>Byte</b>. Mit einem Byte kann ich eine Zahl von 0 bis 255 speichern. Und damit auch Buchstaben, wie du gleich siehst.')}
<h2>Wie wird aus einer Zahl ein Buchstabe?</h2>
<p>Ein Computer kann nur <b>Zahlen</b> speichern, genauer gesagt nur 0 und 1. Buchstaben kennt er eigentlich gar nicht. Damit er trotzdem Text speichern kann, gibt es eine <b>Zeichentabelle</b> (ASCII-Code): Darin hat jedes Zeichen eine feste Nummer. Alle Computer verwenden dieselbe Tabelle, deshalb kann jeder Computer deinen Text lesen.</p>
<div class="card"><div class="xflow"><span><small>Du tippst</small><b class="xk">A</b></span><i>→</i><span><small>Nummer in der Tabelle</small><b>65</b></span><i>→</i><span><small>als Binärzahl gespeichert</small><b class="xm">01000001</b></span><i>→</i><span><small>Bildschirm zeigt</small><b class="xk">A</b></span></div>
<p style="margin-bottom:0">Der Computer <b>übersetzt</b> also für dich: Beim Speichern wird aus dem Buchstaben eine Zahl in 8 Bit, beim Anzeigen wird aus der Zahl wieder ein Buchstabe.</p></div>
<div class="scroll"><table class="pv"><tr><th>Zeichen</th><td>A</td><td>B</td><td>C</td><td>D</td><td>a</td><td>b</td><td>Leerzeichen</td></tr><tr><th>Nummer</th><td>65</td><td>66</td><td>67</td><td>68</td><td>97</td><td>98</td><td>32</td></tr></table></div>
<h2>Der Byte-Baukasten</h2>
<p>Die Lampen sind dieselbe 8-Bit-Stellenwerttafel wie beim Aufwärmen. Neu ist nur das Feld „Zeichen“: Dort zeigt der Computer, welcher Buchstabe zu der Zahl gehört. Schalte die 8 Bit so, dass A, B und C erscheinen.</p>
<div class="lab" id="lampC"></div>
${hef('h4',`<ul><li>Ein <mark>Bit</mark> ist die kleinste Dateneinheit. Es hat genau zwei mögliche Werte: <mark>0</mark> oder <mark>1</mark>.</li><li><mark>8</mark> Bit = 1 <mark>Byte</mark> (Abkürzung: B)</li><li>Ein Zeichen (z. B. ein Buchstabe) braucht <mark>1 Byte</mark> Speicher.</li><li>Damit der Computer Text speichern kann, hat jedes Zeichen eine feste <mark>Nummer</mark> in einer Zeichentabelle (ASCII-Code). Beispiel: A = <mark>65</mark>.</li></ul>`)}
${lvlHead('byte')}${exList(STEPS[SI('byte')].b)}${scSlot('byte')}`,
 init:()=>lamps('lampC',8,[{v:65,l:'A'},{v:66,l:'B'},{v:67,l:'C'}],true)});

    E('num','c2',`${gs.c2.n} ${BU[gs.c2.i]} = ? ${BU[gs.c2.i-1]}`,gs.c2.n*1024,{unit:BU[gs.c2.i-1],hint:'Eine Stufe hinunter: · 1024.',sol:`${gs.c2.n} · 1024 = ${fmt(gs.c2.n*1024)} ${BU[gs.c2.i-1]}.`}),
    E('num','c3',`${fmt(gs.c3.n*1024)} ${BU[gs.c3.i-1]} = ? ${BU[gs.c3.i]}`,gs.c3.n,{unit:BU[gs.c3.i],hint:'Eine Stufe hinauf: : 1024.',sol:`${fmt(gs.c3.n*1024)} : 1024 = ${gs.c3.n} ${BU[gs.c3.i]}.`}),
    (EX.c4={kind:'match',id:'c4',q:'<b>Zuordnen:</b> Welche Angabe ist gleich groß? Wähle zu jedem Speicher die passende Größe.',left:gs.match.map(p=>p[0]),right:gs.mperm.map(i=>gs.match[i][1]),ans:gs.match.map((_,i)=>gs.mperm.indexOf(i)),hint:'Überlege bei jeder Zeile: Eine Stufe hinunter heißt · 1024, eine Stufe hinauf heißt : 1024.',sol:gs.match.map(p=>`${p[0]} = ${p[1]}`).join(' · ')},'c4'),
    (EX.c5={kind:'sort',id:'c5',q:'<b>Sortieren:</b> Bringe die Speichergrößen in die richtige Reihenfolge, von <b>klein</b> (oben) nach <b>groß</b> (unten). Achtung: SI- und Binärpräfixe sind gemischt!',items:gs.sort,start:gs.sstart,hint:'SI-Präfixe (k, M, G) rechnen mit 1000, Binärpräfixe (Ki, Mi, Gi) mit 1024. Rechne alles in die gleiche Einheit um oder überlege, welche Angabe mit 1024 gerechnet ist.',sol:'Mit 1024 gerechnete Angaben sind größer: '+gs.sort.slice().sort((a,b)=>a[1]-b[1]).map(x=>x[0]).join(' < ')},'c5')],

 render:()=>`
<h1>Die Einheitentreppe</h1>
${say('Fotos und Videos sind riesig. Niemand sagt „4 000 000 Byte“. Darum gibt es Vorsilben, die <b>Präfixe</b>.')}
<div class="card"><h3>Zwei Arten von Präfixen</h3><p style="margin-top:0"><b>SI-Präfixe</b> wie kilo (k) rechnen mit <b>1000</b>, wie bei Kilometer. <b>Binärpräfixe</b> wie kibi (Ki) rechnen mit <b>1024</b> = 2<sup>10</sup>, weil Computer im Zweiersystem arbeiten.</p>
<p style="margin-bottom:0"><b>Warum ist das wichtig?</b> Hersteller von Festplatten und USB-Sticks rechnen mit 1000, dein Computer rechnet mit 1024. Deshalb zeigt der Computer bei einer 1-TB-Festplatte nur etwa <b>931 GiB</b> an. Es fehlt nichts, es wird nur anders gezählt. Achtung: Windows schreibt „KB, MB, GB“, meint aber KiB, MiB, GiB.</p></div>
<div class="note">${ico('star','ic')}<div><b>Ab jetzt rechnen wir nur noch mit Binärpräfixen: Jede Stufe ist 1024-mal so groß.</b> Nur zwischen Bit und Byte ist der Faktor 8.</div></div>
<h2>Die Einheitentreppe</h2>
<div class="card">
<div class="slegend"><span>← Treppe hinunter: <b>multiplizieren</b></span><span>Treppe hinauf: <b>dividieren</b> →</span></div>
<div class="stairs" id="stairs"></div>

<h2>Größen-Zoom: Wie viel größer ist das wirklich?</h2>

<div class="card" id="lupe"></div>
${hef('h5',`<p>SI-Präfix: kilo (k) = <mark>1000</mark> &nbsp;&nbsp;|&nbsp;&nbsp; Binärpräfix: kibi (Ki) = <mark>1024</mark></p>
<p><b>Bit</b> –(· <mark>8</mark>)→ <b>Byte</b> –(· <mark>1024</mark>)→ <b>KiB</b> –(· 1024)→ <b>MiB</b> –(· 1024)→ <b>GiB</b> –(· 1024)→ <b>TiB</b></p>
<ul><li>Treppe hinunter (zur kleineren Einheit): <mark>multiplizieren</mark></li><li>Treppe hinauf (zur größeren Einheit): <mark>dividieren</mark></li><li>Hersteller rechnen mit <mark>1000</mark>, der Computer rechnet mit <mark>1024</mark>. Deshalb zeigt der Computer <mark>weniger</mark> Speicher an, als auf der Packung steht.</li></ul>`)}
${lvlHead('stairs')}${exList(STEPS[SI('stairs')].b)}${scSlot('stairs')}`,

/* ---------- exit check logic ---------- */
function ccHTML(c,n){const a=S.cc[c.id];let body;
 if(c.kind==='choice')body=`<div class="opts">${c.opts.map((o,i)=>`<button type="button" class="opt${a?(i===c.ans?' right':(+a.v===i?' wrong':'')):''}" data-cc="${c.id}" data-i="${i}"${a?' disabled':''}>${o}</button>`).join('')}</div>`;
 else body=`<div class="row"><input id="cc-${c.id}" data-ccin="${c.id}" autocomplete="off" inputmode="decimal" aria-label="Antwort"${a?` value="${esc(a.v)}" readonly`:''}>${c.unit?`<span class="unit">${c.unit}</span>`:''}${a?'':`<button type="button" class="calcb" data-calc="cc-${c.id}" title="Taschenrechner" aria-label="Taschenrechner öffnen">${ico('calc','')}</button><button type="button" class="btn" data-ccbtn="${c.id}">Abgeben</button>`}</div>`;
 const fb=a?(a.ok?`<div class="fb good"><span class="okmark">Richtig!</span></div>`:`<div class="fb bad"><b>Leider falsch.</b> Richtig ist: <b>${correctText(c)}</b>. ${c.sol}</div>`):'<div class="fb" aria-live="polite"></div>';
 return `<div class="ex${a&&a.ok?' ok':''}${a&&!a.ok?' no':''}" id="ccx-${c.id}"><div class="q"><span class="n">${n}</span>${c.q}</div>${body}${fb}</div>`}
function ccSubmit(id,v){if(S.cc[id])return;const c=EX[id];const r=judge(c,v);
 if(r.empty){const fb=$('#ccx-'+id+' .fb');fb.className='fb info';fb.textContent=r.msg;return}
 S.cc[id]={v:String(v),ok:r.ok};save();$('#ccx-'+id).outerHTML=ccHTML(c,CC.indexOf(c)+1);ccResult();update()}
function skillRes(){return SKILLS.map((s,i)=>{const cs=CC.filter(c=>c.k===i);return {r:cs.filter(c=>S.cc[c.id]&&S.cc[c.id].ok).length,a:cs.filter(c=>S.cc[c.id]).length,n:cs.length}})}
function ccResult(){const el=$('#ccRes');if(!el)return;
 if(!ccDone()){el.innerHTML=`<p style="color:var(--soft)">Abgegeben: ${CC.filter(c=>S.cc[c.id]).length} von ${CC.length}</p>`;return}
 const N=CC.length,right=CC.filter(c=>S.cc[c.id].ok).length,q=right/N,SR=skillRes();
 const msg=right===N?'Perfekt! Du hast alles richtig.':q>=.75?'Sehr gut! Nur kleine Lücken. Schau sie dir unten an.':q>=.5?'Gute Grundlage! Ein paar Dinge solltest du noch üben.':'Hier ist noch einiges zu tun. Wiederhole die markierten Stationen in Ruhe.';
 const rows=SKILLS.map((s,i)=>{const {r,n}=SR[i],ok=r===n,selfs=s.sc.map(k=>S.sc[k]).filter(Boolean);const sure=selfs.includes('sicher'),weak=selfs.includes('noch nicht');
  let note='';if(!ok&&sure)note='Du warst dir sicher, aber hier hat sich ein Fehler eingeschlichen. Schau noch einmal genau hin.';else if(ok&&weak)note='Besser als gedacht! Du kannst das schon.';
  return `<div class="resrow ${ok?'good':'bad'}"><span class="rdot">${ok?ico('check',''):'!'}</span><div><b>${s.s}</b><small>Dein Selbstcheck: ${selfs.join(', ')||'–'} · Im Exit-Check: ${r} von ${n} richtig</small>${note?`<small class="rnote">${note}</small>`:''}</div>${ok?'<span class="okmark">sitzt</span>':`<button type="button" class="btn sm" data-go="${SI(s.st)}">Nochmal üben</button>`}</div>`}).join('');
 el.innerHTML=`<h2>Dein Ergebnis</h2><div class="card"><div class="big">${right} / ${N}</div><p class="lead" style="margin-top:6px">${msg}</p>${rows}</div>
 <h2>Arbeitsblatt-Check</h2><p>Sind alle Lücken auf deinem Arbeitsblatt ausgefüllt? Fehlt etwas, springe zur Station und hole es nach.</p>
 <ul class="hlist">${Object.keys(HEF).map(id=>`<li><span class="st2${S.hef[id]?' y':''}">${S.hef[id]?ico('check',''):''}</span><span>Kasten ${HEF[id].ab}: ${HEF[id].title}</span><button type="button" class="btn ghost sm" data-go="${SI(HEF[id].step)}">Zur Station</button></li>`).join('')}</ul>
 <div class="card unlock">${ico('star','')}<div><b>Die Profi-Zone ist offen!</b><br>Knifflige Rechnungen, Logik-Rätsel und ein Wortsalat warten.<div class="row"><button type="button" class="btn pro" data-go="${SI('profi')}">Zur Profi-Zone</button></div></div></div>`}
function profUpd(){[['v',PV],['l',PL],['s',PSW]].forEach(([k,a])=>{const e=document.getElementById('pc-'+k);if(e)e.textContent=a.filter(i=>S.done[i]).length;const sec=document.getElementById('p'+k);if(sec)sec.classList.toggle('sdone',a.every(i=>S.done[i]))});
 const e=$('#profEnd');if(e)e.innerHTML=[...PV,...PL,...PSW].every(i=>S.done[i])?`<div class="card unlock">${ico('star','')}<div><b>Alles gelöst!</b> Du bist ein echter Speicher-Experte. Bitty ist beeindruckt.</div></div>`:''}

function lamps(id,n,targets,char){const host=document.getElementById(id);if(!host)return;let bits=Array(n).fill(0),ti=0;const got=new Set();targets.forEach((t,i)=>{if(t.id&&S.done[t.id]){got.add(i);if(ti===i)ti++}});
 const draw=()=>{const v=bits.reduce((a,b,i)=>a+b*2**(n-1-i),0);const terms=bits.map((b,i)=>b?2**(n-1-i):0).filter(x=>x);
  const ch=v>=32&&v<=126?String.fromCharCode(v):'–';
  host.innerHTML=`<div class="lamps">${bits.map((b,i)=>`<button type="button" class="bit${b?' on':''}" data-b="${i}" aria-pressed="${!!b}" aria-label="Stellenwert ${2**(n-1-i)}"><span class="pv">${2**(n-1-i)}</span><span class="bulb">${b}</span></button>`).join('')}</div>
  <div class="readout"><span>Binär</span><b>${bits.join('')}<sub>2</sub></b><span>Dezimal</span><b class="dec">${terms.length>1?terms.join(' + ')+' = ':''}${v}</b>${char?`<span>Zeichen</span><span class="charbox">${ch}</span>`:''}</div>
  <div class="chal">${targets.length?`<span>Stelle ein:</span>${targets.map((t,i)=>`<span class="chip${got.has(i)?' got':i===ti?' now':''}">${t.l}</span>`).join('')}`:''}<button type="button" class="btn ghost sm" data-reset="1">Alle aus</button></div>
  <div class="msg" aria-live="polite">${targets.length&&ti>=targets.length?'Alle gefunden. Stark!':''}</div>`;
  if(ti<targets.length&&v===targets[ti].v){got.add(ti);if(targets[ti].id){S.done[targets[ti].id]=1;save();setTimeout(update)}ti++;host.querySelector('.msg').textContent=ti>=targets.length?'Alle gefunden. Stark!':`Richtig! ${targets[ti-1].l} = ${bits.join('')}. Weiter mit ${targets[ti].l}.`;host.querySelectorAll('.chip')[ti-1].className='chip got';if(ti<targets.length)host.querySelectorAll('.chip')[ti].className='chip now'}};
 host.addEventListener('click',e=>{const b=e.target.closest('[data-b]');if(b){bits[+b.dataset.b]^=1;draw();host.querySelector(`[data-b="${b.dataset.b}"]`).focus()}if(e.target.closest('[data-reset]')){bits.fill(0);draw()}});draw();
 host.setBits=v=>{bits=bits.map((_,i)=>(v>>(n-1-i))&1);draw()}}

 const fi=t=>{const k=fIcon(t);const c={doc:'#d93025',img:'#0f9d58',film:'#7b4fe0',music:'#f29900'}[k];return `<svg class="fico" viewBox="0 0 20 20" aria-hidden="true">${k==='doc'?`<path d="M5 2h7l4 4v12H5z" fill="${c}" opacity=".18"/><path d="M5 2h7l4 4v12H5zM12 2v4h4" fill="none" stroke="${c}" stroke-width="1.6"/>`:k==='img'?`<rect x="2" y="4" width="16" height="12" rx="2" fill="${c}" opacity=".2"/><rect x="2" y="4" width="16" height="12" rx="2" fill="none" stroke="${c}" stroke-width="1.6"/><path d="M4 14l4-4 3 3 2-2 3 3" fill="none" stroke="${c}" stroke-width="1.6"/>`:k==='film'?`<rect x="2" y="5" width="11" height="10" rx="2" fill="${c}"/><path d="M13 9l5-3v8l-5-3z" fill="${c}"/>`:`<path d="M7 15V5l9-2v10" fill="none" stroke="${c}" stroke-width="1.8"/><circle cx="5" cy="15" r="2.5" fill="${c}"/><circle cx="14" cy="13" r="2.5" fill="${c}"/>`}</svg>`};
 const fold=`<svg class="fico" viewBox="0 0 20 20" aria-hidden="true"><path d="M2 5a1 1 0 0 1 1-1h5l2 2h7a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z" fill="#f6c343"/><path d="M2 8h16v8a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z" fill="#ffd866"/></svg>`;

  <div class="exlist"><div class="exhead"><span>Name</span><span>Typ</span></div>${files.map((x,i)=>`<button type="button" class="exfile${i===sel?' on':''}" data-file="${i}">${fi(x[1])}<span class="exn">${x[0]}</span><span class="ext">${x[1]}</span></button>`).join('')}</div></div>

  ${menu?`<div class="exmenu" style="left:${menu.x}px;top:${menu.y}px"><button type="button" disabled>Öffnen</button><button type="button" disabled>Kopieren</button><hr><button type="button" data-ex="props">Eigenschaften</button></div>`:''}
  ${props&&f?`<div class="exprops"><div class="expbox"><div class="expt">Eigenschaften von ${f[0]}</div><div class="exph">${fi(f[1])}<b>${f[0]}</b></div><table><tr><td>Dateityp:</td><td>${f[1]} (.${f[0].split('.').pop()})</td></tr><tr><td>Ort:</td><td>Schule\\Klassenfahrt\\${folder}</td></tr><tr><td>Größe:</td><td><b>${fmt(f[2])} ${UN[f[3]]}</b> (${bytes(f[2],f[3])} Bytes)</td></tr></table><div class="expa"><button type="button" class="btn sm" data-ex="close">OK</button></div></div></div>`:''}`};
 host.addEventListener('click',e=>{const t=e.target;let b;
  if(b=t.closest('[data-folder]')){folder=b.dataset.folder;sel=null;menu=null;props=null;draw()}
  else if(b=t.closest('[data-ex]')){if(b.dataset.ex==='props'&&sel!=null)props=true;else props=null;menu=null;draw()}

  else if(menu){menu=null;draw()}});

 host.addEventListener('contextmenu',e=>{const b=e.target.closest('[data-file]');e.preventDefault();if(!b)return;sel=+b.dataset.file;const r=host.getBoundingClientRect();menu={x:Math.min(e.clientX-r.left,r.width-170),y:Math.min(e.clientY-r.top,r.height-120)};props=null;draw()});
 draw()}

function stairs(){const U=BU;const F=$('#cvF'),T=$('#cvT'),Vv=$('#cvV'),st=$('#stairs');const fac=bfac;
 F.innerHTML=U.map((u,i)=>`<option value="${i}">${u}</option>`).join('');T.innerHTML=F.innerHTML;F.value='4';T.value='3';
 const draw=()=>{const f=+F.value,t=+T.value,lo=Math.min(f,t),hi=Math.max(f,t);
  st.innerHTML=U.map((u,i)=>`<button type="button" class="stair${i===f?' from':i===t?' to':(i>lo&&i<hi)?' path':''}" data-u="${i}" style="height:${46+i*26}px">${i?`<span class="fac">${fac(i)}</span>`:''}${u}</button>`).join('');
  const v=parseDE(Vv.value);if(isNaN(v)){$('#cvR').textContent='Bitte eine Zahl eingeben.';$('#cvC').textContent='';return}
  let x=v,ch=[`${fmt(v)} ${U[f]}`];
  if(t<f){for(let i=f;i>t;i--){x*=fac(i);ch.push(`· ${fac(i)} = ${fmt(x)} ${U[i-1]}`)}}else{for(let i=f;i<t;i++){x/=fac(i+1);ch.push(`: ${fac(i+1)} = ${fmt(x)} ${U[i+1]}`)}}
  $('#cvR').textContent=`${fmt(v)} ${U[f]} = ${fmt(x)} ${U[t]}`;$('#cvC').textContent=f===t?'Gleiche Einheit, nichts zu rechnen.':`Rechenweg: ${ch.join('  ')} (${t<f?'Treppe hinunter → multiplizieren':'Treppe hinauf → dividieren'})`};
 draw();[F,T].forEach(s=>s.addEventListener('change',draw));Vv.addEventListener('input',draw);
 st.addEventListener('click',e=>{const b=e.target.closest('[data-u]');if(b){T.value=b.dataset.u;draw()}})}

function lenTxt(mm){if(mm<10)return fmt(Math.round(mm*10)/10)+' mm';if(mm<1000)return fmt(Math.round(mm/10*10)/10)+' cm';if(mm<1e6)return fmt(Math.round(mm/1000*10)/10)+' m';return fmt(Math.round(mm/1e6*10)/10)+' km'}
function countTime(n){const y=n/31557600;if(n<60)return fmt(n)+' Sekunden';if(n<3600)return fmt(Math.round(n/60))+' Minuten';if(n<86400)return fmt(Math.round(n/360)/10)+' Stunden';if(n<31557600)return fmt(Math.round(n/86400))+' Tage';return fmt(y<10?Math.round(y*10)/10:Math.round(y))+' Jahre'}

const CALC={target:null,expr:'',open:false};
function calcEval(src){const t=src.replace(/·/g,'*').replace(/:/g,'/').replace(/−/g,'-').replace(/,/g,'.').match(/\d+(\.\d+)?|\.\d+|[-+*/()]/g)||[];let i=0;
 const peek=()=>t[i],next=()=>t[i++];
 const factor=()=>{const x=next();if(x==='-')return -factor();if(x==='+')return factor();if(x==='('){const v=expr();if(next()!==')')throw 0;return v}const n=parseFloat(x);if(isNaN(n))throw 0;return n};
 const term=()=>{let v=factor();while(peek()==='*'||peek()==='/'){const o=next(),w=factor();v=o==='*'?v*w:v/w}return v};
 const expr=()=>{let v=term();while(peek()==='+'||peek()==='-'){const o=next(),w=term();v=o==='+'?v+w:v-w}return v};
 if(!t.length)return null;const v=expr();if(i<t.length||!isFinite(v))throw 0;return Math.round(v*1e9)/1e9}

 ${H.codes.map(code=>{const d=H.data[code],on=!!hconns[code];
  return `<tr><td><b>${esc(code)}</b></td><td><span class="cdot ${on?'on':''}"></span>${on?'online':d?'offline':'–'}</td><td>${d?`<span class="mini"><i style="width:${d.pct}%"></i></span> ${d.pct} %`:''}</td><td>${d?esc(STEPS[d.step].title):''}</td>
  ${SCALL.map(x=>{const v=d&&d.sc[x.key];return `<td>${v?`<span class="rt ${RCL[v]}" title="${esc(v)}">${v==='sicher'?'S':v==='fast'?'F':'N'}</span>`:''}</td>`}).join('')}
  ${SKILLS.map((s,i)=>{const k=d&&d.exit.sk[i];if(!k||k[1]<k[2])return '<td></td>';return `<td>${k[0]===k[2]?'<span class="lz ok" title="erreicht">✓</span>':k[0]>0?'<span class="lz part" title="teilweise">◐</span>':'<span class="lz no" title="nicht erreicht">✗</span>'}</td>`}).join('')}
  <td>${d&&d.exit.a?`${d.exit.r}/${d.exit.a}`:''}</td></tr>`}).join('')}</tbody></table></div>
 <div class="hleg"><div><b>Selbstcheck</b> (S = sicher, F = fast, N = noch nicht):<ol>${SCALL.map(x=>`<li>${esc(x.t)}</li>`).join('')}</ol></div><div><b>Lernziele im Exit-Check</b> (✓ erreicht, ◐ teilweise, ✗ nicht erreicht):<ol>${SKILLS.map(s=>`<li>${esc(s.s)}</li>`).join('')}</ol></div></div>`}
function hostOpen(){return ov.classList.contains('host')&&ov.classList.contains('show')}
function renderHost(err){if(!hostOpen())return;const box=$('#hBody');if(!box)return;
 box.innerHTML=`<section class="hsec"><h3>1. Raum</h3>
 ${hosting()?`<div class="hroom"><span>Raumcode</span><b>${esc(H.room)}</b></div><p>Schreibe den Raumcode an die Tafel. <b>Lass diese Seite geöffnet</b>, solange die Klasse arbeitet: Die Ergebnisse kommen direkt in diesem Browser an und werden nur hier gespeichert.</p>`:`<p>${hstate==='connecting'?'Raum wird geöffnet …':'Der Raum ist geschlossen.'}</p>`}
 ${err?`<p class="fb bad">${err}</p>`:''}
 <div class="row">${hosting()?'':`<button type="button" class="btn" data-h="open">${H.room?'Raum '+esc(H.room)+' öffnen':'Raum öffnen'}</button>`}<button type="button" class="btn ghost" data-h="new">Neuen Raumcode erzeugen</button></div></section>
 <section class="hsec"><h3>2. Schülercodes</h3><p>Gib jedem Kind einen Code und notiere die Zuordnung nur bei dir. Im Labor erscheinen ausschließlich die Codes.</p>
 <div class="row"><label for="hN">Anzahl</label><input id="hN" type="number" min="1" max="40" value="${H.codes.length||28}" style="width:5em"><button type="button" class="btn ghost" data-h="codes">${H.codes.length?'Neue Codes erzeugen':'Codes erzeugen'}</button>${H.codes.length?'<button type="button" class="btn ghost" data-h="copy">Liste kopieren</button>':''}</div>
 ${H.codes.length?`<div class="hcodes">${H.codes.map(c=>`<span>${esc(c)}</span>`).join('')}</div>`:''}</section>
 <section class="hsec"><h3>3. Lernstand <small>(${Object.keys(hconns).length} von ${H.codes.length} online)</small></h3>${hostTable()}
 <div class="row">${H.codes.length?'<button type="button" class="btn ghost" data-h="csv">Als Tabelle kopieren (CSV)</button><button type="button" class="btn ghost" data-h="clear">Ergebnisse löschen</button>':''}</div><p id="hMsg" class="okmark"></p></section>
 <section class="hsec"><h3>4. Vorschau und Ablauf</h3>
 <label class="chk"><input type="checkbox" data-h="preview"${H.preview?' checked':''}${hosting()?'':' disabled'}> Lehrkraft-Vorschau: In diesem Browser alle Stationen freischalten (nur während der Raum geöffnet ist)</label>
 <details><summary>Ablauf der Stunde (45 min)</summary>${planTable()}</details></section>`}
const PLANS=[['0–2 min','A: Aufwärmen 8 Bit, Selbstcheck','EA am PC'],['2–12','B: Bit und Byte, AB Kasten 1, Selbstcheck','EA am PC'],['12–22','C: Einheitentreppe, Zuordnen, Sortieren, AB Kasten 2, Selbstcheck','EA am PC'],['22–37','D: Speicher-Check im Datei-Explorer, AB Kasten 3, Selbstcheck','EA am PC'],['37–42','Exit-Check (5 Transferaufgaben)','EA am PC'],['42–45','Puffer: Besprechung oder Profi-Zone für Schnelle','Plenum / EA']];
const planTable=()=>`<div class="scroll"><table class="plan">${PLANS.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td style="color:var(--soft)">${r[2]}</td></tr>`).join('')}</table></div>`;
function hostPanel(){dialog(`<div class="hhead"><h2 style="margin:0">Lehrkraft: Raum und Lernstand</h2><button type="button" class="btn ghost sm" data-close>Schließen</button></div><div id="hBody"></div>`,'host');renderHost()}
dlg.addEventListener('click',async e=>{const b=e.target.closest('[data-h]');if(!b||b.tagName==='INPUT')return;const a=b.dataset.h;const msg=t=>{const m=$('#hMsg');if(m)m.textContent=t};
 if(a==='open')openRoom(false);
 else if(a==='new'){if(b.dataset.sure||!hosting()){openRoom(true)}else{b.dataset.sure=1;b.textContent='Sicher? Alle müssen neu beitreten. Ja, neuer Code'}}
 else if(a==='codes'){if(H.codes.length&&!b.dataset.sure){b.dataset.sure=1;b.textContent='Sicher? Alte Codes und Ergebnisse werden gelöscht. Ja';return}const n=Math.max(1,Math.min(40,parseInt($('#hN').value)||28));const set=new Set();while(set.size<n)set.add(genCode(4));H.codes=[...set];H.data={};H.seen={};hsave();renderHost()}
 else if(a==='copy'){try{await navigator.clipboard.writeText(H.codes.join('\n'));msg('Codes kopiert.')}catch(x){msg('Kopieren nicht möglich.')}}
 else if(a==='csv'){const head=['Code','Fortschritt %',...SCALL.map((x,i)=>'S'+(i+1)+' '+x.t),...SKILLS.map((s,i)=>'L'+(i+1)+' '+s.s),'Exit richtig'];
  const rows=H.codes.map(c=>{const d=H.data[c];return [c,d?d.pct:'',...SCALL.map(x=>d&&d.sc[x.key]||''),...SKILLS.map((s,i)=>{const k=d&&d.exit.sk[i];return !k||k[1]<k[2]?'':k[0]===k[2]?'erreicht':k[0]>0?'teilweise':'nicht erreicht'}),d&&d.exit.a?d.exit.r+'/'+d.exit.a:'']});
  const csv=[head,...rows].map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\n');try{await navigator.clipboard.writeText(csv);msg('Tabelle kopiert. In Excel oder Tabellen einfügen.')}catch(x){msg('Kopieren nicht möglich.')}}
 else if(a==='clear'){if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Wirklich alle Ergebnisse löschen?';return}H.data={};H.seen={};hsave();renderHost()}});
dlg.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.h==='preview'){H.preview=e.target.checked;hsave();renderNav()}});

/* ---------- buttons ---------- */
let lastIn=null;document.addEventListener('focusin',e=>{const d=e.target.dataset||{};if(d.in||d.ccin)lastIn=e.target.id});
$('#calcBtn').addEventListener('click',()=>{const t=lastIn&&document.getElementById(lastIn);calcOpen(t&&!t.readOnly?lastIn:null)});
$('#nextBtn').addEventListener('click',()=>{if(stepDone(S.step))go(S.step+1)});
$('#prevBtn').addEventListener('click',()=>go(S.step-1));
$('#stepsBtn').addEventListener('click',()=>{dialog(`<nav class="metro" style="display:block;position:static;max-height:none;padding:0">${$('#metro').innerHTML}</nav><div class="acts"><button type="button" class="btn ghost" data-close>Schließen</button></div>`,'drawer')});
$('#fontBtn').addEventListener('click',()=>{dialog(`<h2 style="margin-top:0">Schriftgröße</h2><div class="seg">${[[15,'Klein'],[17,'Normal'],[20,'Groß']].map(([v,l])=>`<button type="button" data-fs="${v}" aria-pressed="${S.fs===v}">${l}</button>`).join('')}</div><div class="acts"><button type="button" class="btn" data-close>Fertig</button></div>`)});
$('#ver').addEventListener('dblclick',hostPanel);
$('#conn').addEventListener('click',()=>{if(hosting())hostPanel();else if(!(S.join&&cstate==='on'))joinDialog()});
function resetAll(){try{localStorage.removeItem(KEY)}catch(x){}const fs=S.fs,join=S.join;S=fresh();S.fs=fs;S.join=join;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}location.hash='';location.reload()}
$('#resetBtn').addEventListener('click',()=>{dialog(`<h2 style="margin-top:0">Neu starten?</h2><p>Alle Antworten, Haken und Selbstchecks in diesem Browser werden gelöscht. Du bekommst neue Aufgaben und startest wieder bei Schritt 1.</p><p><b>Das kann man nicht rückgängig machen.</b></p><div class="acts"><button type="button" class="btn ghost" data-close>Abbrechen</button><button type="button" class="btn danger" id="rstYes">Ja, neu starten</button></div>`);$('#rstYes').onclick=resetAll});

/* ---------- delegated events ---------- */
document.addEventListener('click',e=>{const t=e.target;let b;
 if(b=t.closest('[data-check]')){const id=b.dataset.check;check(id,readVal(id),null)}
 else if(b=t.closest('[data-choice]')){check(b.dataset.choice,b.dataset.i,b)}
 else if(b=t.closest('[data-sort]')){const id=b.dataset.sort,d=EX[id];if(S.done[id])return;const cur=(S.sortcur[id]||d.start).slice(),p=+b.dataset.p,q=p+(+b.dataset.d);if(q<0||q>=cur.length)return;[cur[p],cur[q]]=[cur[q],cur[p]];S.sortcur[id]=cur;save();$('#sl-'+id).innerHTML=sortList(id);const nb=$('#sl-'+id).children[q].querySelector(`[data-d="${b.dataset.d}"]`)||$('#sl-'+id).children[q].querySelector('.sb:not([disabled])');nb&&nb.focus()}
 else if(b=t.closest('[data-ccbtn]')){const id=b.dataset.ccbtn;ccSubmit(id,$('#cc-'+id).value)}
 else if(b=t.closest('[data-cc]')){ccSubmit(b.dataset.cc,b.dataset.i)}
 else if(b=t.closest('[data-calc]')){calcOpen(b.dataset.calc)}
 else if(b=t.closest('[data-hint]')){const d=EX[b.dataset.hint];const fb=$('#ex-'+d.id+' .fb');fb.className='fb info';fb.innerHTML='<b>Tipp:</b> '+d.hint}
 else if(b=t.closest('[data-sol]')){const id=b.dataset.sol,d=EX[id];S.done[id]=1;save();solved(id,false);$('#ex-'+id+' .fb').innerHTML='<b>Lösung:</b> '+(d.sol||correctText(d))+'<br>Schau dir den Weg genau an.';update()}
 else if(b=t.closest('[data-go]')){const i=+b.dataset.go;if(canGo(i))go(i);else{const m=$('#pagerHint');m&&m.animate&&m.animate([{transform:'scale(1)'},{transform:'scale(1.06)'},{transform:'scale(1)'}],{duration:400})}}
 else if(b=t.closest('.pjump')){e.preventDefault();const tg=document.querySelector(b.getAttribute('href'));tg&&tg.scrollIntoView({behavior:'smooth'})}
 else if(b=t.closest('[data-sc]')){const k=b.dataset.sc;S.sc[k]=b.dataset.v;save();b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));const key=k.split(':')[0];const ok=$('#scOk');if(ok)ok.disabled=!SC[key].every((_,i)=>S.sc[key+':'+i])}
 else if(b=t.closest('[data-scedit]')){openSC(b.dataset.scedit)}
 else if(b=t.closest('[data-fs]')){S.fs=+b.dataset.fs;save();document.documentElement.style.setProperty('--fs',S.fs+'px');b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))}
 else if(t.closest('#cele')){$('#cele').className='cele'}});
document.addEventListener('change',e=>{const d=e.target.dataset||{};
 if(d.hef){S.hef[d.hef]=e.target.checked;save();e.target.closest('.hef').classList.toggle('done',e.target.checked);update()}
 else if(d.match){const id=d.match;const cur=S.matchcur[id]||[];cur[+d.i]=e.target.value;S.matchcur[id]=cur;save();e.target.closest('.mrow').classList.remove('bad')}});
document.addEventListener('keydown',e=>{const d=e.target.dataset;if(e.key!=='Enter'||!d)return;if(d.in)check(d.in,e.target.value);else if(d.ccin)ccSubmit(d.ccin,e.target.value)});
const fromHash=()=>{const m=location.hash.match(/^#schritt-(\d+)$/);return m?+m[1]-1:null};
window.addEventListener('hashchange',()=>{const h=fromHash();if(h!==null&&h!==S.step&&canGo(h))go(h)});
S.cele=S.cele||{};STEPS.forEach((s,i)=>{if(stepDone(i))S.cele[s.key]=1});
const wantHost=location.hash==='#lehrkraft';const h0=fromHash();go(h0!==null&&canGo(h0)?h0:Math.min(S.step,firstOpen()),true);
if(wantHost)hostPanel();else if(!S.join)joinDialog();else if(!S.join.solo)joinRoom(S.join.room,S.join.code,false);
}
</script>
</body>
